s":[]},{"id":14,"cueNo":15,"displayNo":15,"sourceUid":"merged-mtcyyp6o-2218","uid":"merged-mtcyyp6o-2218","originalCueNo":15,"vi":"(Bà) Đợi đã! Khoan! Cháu bảo cháu ở nhà một mình hả?\nVâng, chỉ có mình cháu thôi.\nBây giờ muộn lắm rồi.\nBà đã bảo có đàn ông lạ mặt lởn vởn quanh đây.","ko":"(할머니) 잠깐! 혼자 있다고 했지?\n예, 저 혼잡니다. 지금 몇 신데?\n수상한 남자 댕긴다고 경고까지 했는데...","en":"(Grandma) Wait! Wait. You said you are alone, right?\nYes, I am alone right now.\nIt's so late.\nYou know there is a strange man lurking around\nand yet everyone is later than usual.","text":"(Bà) Đợi đã! Khoan! Cháu bảo cháu ở nhà một mình hả?\nVâng, chỉ có mình cháu thôi.\nBây giờ muộn lắm rồi.\nBà đã bảo có đàn ông lạ mặt lởn vởn quanh đây.\\n(할머니) 잠깐! 혼자 있다고 했지?\n예, 저 혼잡니다. 지금 몇 신데?\n수상한 남자 댕긴다고 경고까지 했는데...\\n(Grandma) Wait! Wait. You said you are alone, right?\nYes, I am alone right now.\nIt's so late.\nYou know there is a strange man lurking around\nand yet everyone is later than usual.","koRange":{"start":251.641251,"end":263.248018},"viRange":{"start":179.5092,"end":221.591247},"start":179.5092,"end":263.248018,"koSentenceMarks":[257.266,260.57,263],"koShadowSegments":[{"index":0,"start":251.641251,"end":257.266,"text":"(할머니) 잠깐! 혼자 있다고 했지?","speed":1,"cueUid":"merged-mtcyyp6o-2218"},{"index":1,"start":257.266,"end":260.57,"text":"예, 저 혼잡니다. 지금 몇 신데?","speed":1,"cueUid":"merged-mtcyyp6o-2218"},{"index":2,"start":260.57,"end":263,"text":"수상한 남자 댕긴다고 경고까지 했는데...","speed":1,"cueUid":"merged-mtcyyp6o-2218"}],"hasShadow":true,"segments":[{"index":0,"start":251.641251,"end":257.266,"text":"(할머니) 잠깐! 혼자 있다고 했지?","speed":1,"cueUid":"merged-mtcyyp6o-2218"},{"index":1,"start":257.266,"end":260.57,"text":"예, 저 혼잡니다. 지금 몇 신데?","speed":1,"cueUid":"merged-mtcyyp6o-2218"},{"index":2,"start":260.57,"end":263,"text":"수상한 남자 댕긴다고 경고까지 했는데...","speed":1,"cueUid":"merged-mtcyyp6o-2218"}]},{"id":15,"cueNo":16,"displayNo":16,"sourceUid":"merged-mtczeb6l-2219","uid":"merged-mtczeb6l-2219","originalCueNo":16,"vi":"Vậy mà mấy đứa còn về muộn hơn thường ngày.\nLỡ xảy ra chuyện gì thì sao?\nBà nói đúng lắm ạ.\nMất bò mới làm chuồng thì có tác dụng gì.\nĐúng ạ, chẳng còn ích gì nữa.\nNếu người thuê nhà bà gặp chuyện không may thì bà sẽ thế nào?","ko":"어떻게 된 게 여봐란듯이 더 늦네?\n그러다 무슨 일 생기면 어떡해?\n그러게 말입니다\n일 터지고 후회해봤자 아무 소용없어\n그럼요, 소용없습니다\n내 집에 사는 사람한테 무슨 일 생겨봐","en":"What if something happens to them?\nExactly, ma'am.\nIt's too late to regret after something actually happens.\nOf course, ma'am. You're right.\nIf something happens to my tenants, how do you think I'd feel?","text":"Vậy mà mấy đứa còn về muộn hơn thường ngày.\nLỡ xảy ra chuyện gì thì sao?\nBà nói đúng lắm ạ.\nMất bò mới làm chuồng thì có tác dụng gì.\nĐúng ạ, chẳng còn ích gì nữa.\nNếu người thuê nhà bà gặp chuyện không may thì bà sẽ thế nào?\\n어떻게 된 게 여봐란듯이 더 늦네?\n그러다 무슨 일 생기면 어떡해?\n그러게 말입니다\n일 터지고 후회해봤자 아무 소용없어\n그럼요, 소용없습니다\n내 집에 사는 사람한테 무슨 일 생겨봐\\nWhat if something happens to them?\nExactly, ma'am.\nIt's too late to regret after something actually happens.\nOf course, ma'am. You're right.\nIf something happens to my tenants, how do you think I'd feel?","koRange":{"start":263.248018,"end":275.555376},"viRange":{"start":221.591247,"end":235.624807},"start":221.591247,"end":275.555376,"koSentenceMarks":[265.644,267.745,268.7,271.425,273,275.555],"koShadowSegments":[{"index":0,"start":263.248018,"end":265.644,"text":"어떻게 된 게 여봐란듯이 더 늦네?","speed":1,"cueUid":"merged-mtczeb6l-2219"},{"index":1,"start":265.644,"end":267.745,"text":"그러다 무슨 일 생기면 어떡해?","speed":1,"cueUid":"merged-mtczeb6l-2219"},{"index":2,"start":267.745,"end":268.7,"text":"그러게 말입니다","speed":1,"cueUid":"merged-mtczeb6l-2219"},{"index":3,"start":268.7,"end":271.425,"text":"일 터지고 후회해봤자 아무 소용없어","speed":1,"cueUid":"merged-mtczeb6l-2219"},{"index":4,"start":271.425,"end":273,"text":"그럼요, 소용없습니다","speed":1,"cueUid":"merged-mtczeb6l-2219"},{"index":5,"start":273,"end":275.555,"text":"내 집에 사는 사람한테 무슨 일 생겨봐","speed":1,"cueUid":"merged-mtczeb6l-2219"}],"hasShadow":true,"segment k care of things from my end.","text":"Các cậu nghe thấy rồi nhỉ. Có đàn ông lạ quanh quẩn gần đây.\nSao thế? Cậu đoán ra ai đó à?\nCậu nghĩ hắn sẽ đến xin cậu thêm cơ hội à?\nKhông. Anh ta không phải kiểu sẽ cầu xin.\nNếu không phải thằng đó thì…\nChị cắt đứt sạch sẽ rồi.\\n(송지원) 아...다들 들었지?\n수상한 남자 오늘도 출몰했대\n(송지원) 왜? 혹시나 싶어?\n(송지원) 한 번만 봐달라고 싹싹 빌러 온 것 같어?\n아아니! 싹싹 빈다고 뭐...그리고 그럴 사람도 아니야\n그놈의 시키 아니면...난 정리됐는데...\\nYou heard her. There's a strange man outside.\nWhat? Do you doubt someone?\nDo you think he came to beg you for another chance?\nNo. He's not the type to ever do that.\nIf it's not him, who...\nI already took care of things from my end.","koRange":{"start":300,"end":322},"viRange":{"start":253.692834,"end":278.805215},"start":253.692834,"end":322,"koSentenceMarks":[302.214,304.368,309.58,311.952,315.914,320.535],"koShadowSegments":[{"index":0,"start":300,"end":302.214,"text":"(송지원) 아...다들 들었지?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":1,"start":302.214,"end":304.368,"text":"수상한 남자 오늘도 출몰했대","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":2,"start":304.368,"end":309.58,"text":"(송지원) 왜? 혹시나 싶어?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":3,"start":309.58,"end":311.952,"text":"(송지원) 한 번만 봐달라고 싹싹 빌러 온 것 같어?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":4,"start":311.952,"end":315.914,"text":"아아니! 싹싹 빈다고 뭐...그리고 그럴 사람도 아니야","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":5,"start":315.914,"end":320.535,"text":"그놈의 시키 아니면...난 정리됐는데...","speed":1,"cueUid":"merged-mtd2j3vp-3"}],"hasShadow":true,"segments":[{"index":0,"start":300,"end":302.214,"text":"(송지원) 아...다들 들었지?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":1,"start":302.214,"end":304.368,"text":"수상한 남자 오늘도 출몰했대","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":2,"start":304.368,"end":309.58,"text":"(송지원) 왜? 혹시나 싶어?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":3,"start":309.58,"end":311.952,"text":"(송지원) 한 번만 봐달라고 싹싹 빌러 온 것 같어?","speed":1,"cueUid":"merged-mtd2j3vp-3"},{"index":4 , chuyên gia nghiên cứu chủ nghĩa khiêu dâm nói.\\n아우 선배! 야...\n아니면 고자 아니야? 아니에요!\n아닌 걸 어떻게 알어? 봤어?\n아뇨... 그건 아닌데... 왜 그래요, 진짜... \n자, 조만간 있을 우리 은순이의 소중한 그날을 위해 에로계의 석학! \n남녀상열지사의 산지식인. 강이나 선생님을 모시겠습니다\\nStop it. Hey, if it's not true, you can just say so.\nIt's not true. But how do we know that? Did you see this?\nNo, that's not it. You guys are so mean.\nFor the sake of our precious Eun-Soon. Her special day is coming soon.\nLet's hear from the master of eroticism, Professor Kang.","koRange":{"start":336.795365,"end":361.155586},"viRange":{"start":295.78271,"end":318.027427},"start":295.78271,"end":361.155586,"koSentenceMarks":[339.913,343.004,345.204,351.4,357,361.156],"koShadowSegments":[{"index":0,"start":336.795365,"end":339.913,"text":"아우 선배! 야...","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":1,"start":339.913,"end":343.004,"text":"아니면 고자 아니야? 아니에요!","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":2,"start":343.004,"end":345.204,"text":"아닌 걸 어떻게 알어? 봤어?","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":3,"start":345.204,"end":351.4,"text":"아뇨... 그건 아닌데... 왜 그래요, 진짜...","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":4,"start":351.4,"end":357,"text":"자, 조만간 있을 우리 은순이의 소중한 그날을 위해 에로계의 석학!","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":5,"start":357,"end":361.155586,"text":"남녀상열지사의 산지식인. 강이나 선생님을 모시겠습니다.","speed":1,"cueUid":"merged-mtd2y3z3-5"}],"hasShadow":true,"segments":[{"index":0,"start":336.795365,"end":339.913,"text":"아우 선배! 야...","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":1,"start":339.913,"end":343.004,"text":"아니면 고자 아니야? 아니에요!","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":2,"start":343.004,"end":345.204,"text":"아닌 걸 어떻게 알어? 봤어?","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":3,"start":345.204,"end":351.4,"text":"아뇨... 그건 아닌데... 왜 그래요, 진짜...","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":4,"start":351.4,"end":357,"text":"자, 조만간 있을 우리 은순이의 소중한 그날을 위해 에로계의 석학!","speed":1,"cueUid":"merged-mtd2y3z3-5"},{"index":5,"start":357,"end":36 :"거액의 채무 관계가...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":3,"start":543.826,"end":552.238,"text":"그...이번에 조사하다가 새로 알게 된 건데...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":4,"start":552.238,"end":556.24,"text":"17년 전에 시어머니가 돌아가셨을 때도...","speed":1,"cueUid":"merged-mtefufcs-7"}],"hasShadow":true,"segments":[{"index":0,"start":456.966,"end":538.807,"text":"(보험조사관) 가게 상황이 별로 안 좋았을 때고...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":1,"start":538.807,"end":542.33,"text":"(보험조사관) 4년 전에 아버지가 돌아가셨을 때는...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":2,"start":542.33,"end":543.826,"text":"거액의 채무 관계가...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":3,"start":543.826,"end":552.238,"text":"그...이번에 조사하다가 새로 알게 된 건데...","speed":1,"cueUid":"merged-mtefufcs-7"},{"index":4,"start":552.238,"end":556.24,"text":"17년 전에 시어머니가 돌아가셨을 때도...","speed":1,"cueUid":"merged-mtefufcs-7"}]},{"id":32,"cueNo":33,"displayNo":33,"sourceUid":"merged-mtefujsr-8","uid":"merged-mtefujsr-8","originalCueNo":33,"vi":"[Nhạc nền bắt đầu]\n[làm hết cơn ho]","ko":"[배경 음악 시작]\n[헛기침하다]","en":"[Background music starts]\n[clears cough]","text":"[Nhạc nền bắt đầu]\n[làm hết cơn ho]\\n[배경 음악 시작]\n[헛기침하다]\\n[Background music starts]\n[clears cough]","koRange":null,"viRange":null,"start":543.9,"end":544.96,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":33,"cueNo":34,"displayNo":34,"sourceUid":"merged-mtegad19-10","uid":"merged-mtegad19-10","originalCueNo":34,"vi":"Mẹ chồng á? Vâng. À, mẹ chồng của mẹ cô.\nTức là bà nội của cô. Mẹ cô là người nhận tiền bảo hiểm khi bà nội cô qua đời.\nTôi không biết… Dĩ nhiên là cô không biết. Lúc đó cô mới hai tuổi.\nHoặc ba tuổi. Vậy… Sao ạ?","ko":"시어머니요? 그러니까...엄마의 시어머니...\n유은재씨 할머니죠, 할머니\n유은재씨 할머니가 돌아가셨을 때도...\n보험금을 수령하셨더라구요. 저는 잘...\n그렇죠, 모르실 거예요. 그때가 두 살 때니까... 아니 세 살. 저기...예?","en":"Mother-in-Law? Well...Your mother's mother-in-law.\nYour grandmother. When your grandmother passed away, she collected an insurance payout.\nI don't really know...I'm sure you didn't know. You were only two years old then.\nOr maybe three years old.\nSo... Yes?","text":"Mẹ chồng á? Vâng. À, mẹ chồng của mẹ cô.\nTức là bà nội của cô. Mẹ cô là người nhận tiền bảo hiểm khi bà nội cô qua đời.\nTôi không biết… Dĩ nhiên là cô không biết. Lúc đó cô mới hai tuổi.\nHoặc ba tuổi. Vậy… Sao ạ?\\n시어머니요? 그러니까...엄마의 시어머니...\n유은재씨 할머니죠, 할머니\n유은재씨 할머니가 돌아가셨을 때도...\n보험금을 수령하셨더라구요. 저는 잘...\n그렇죠, 모르실 거예요. 그때가 두 살 때니까... 아니 세 살. 저기...예?\\nMother-in-Law? Well...Your mother's mother-in-law.\nYour grandmother. When your grandmother passed away, she collected an insurance payout.\nI don't really know...I'm sure you didn't know. You were only two years old then.\nOr maybe three years old.\nSo... Yes?","koRange":{"start":556.24,"end":581.714462},"viRange":{"start":514.096682,"end":538.746826},"start":514.096682,"end":581.714462,"koSentenceMarks":[563.296,566.085,572.786,581.714],"koShadowSegments":[{"index":0,"start":556.24,"end":563.296,"text":"시어머니요? 그러니까...엄마의 시어머니...유은재씨 할머니죠, 할머니","speed":1,"cueUid":"merged-mtegad19-10"},{"index":1,"start":563.296,"end":566.085,"text":"유은재씨 할머니가 돌아가셨을 때도...","speed":1,"cueUid":"merged-mtegad19-10"},{"index":2,"start":566.085,"end":572.786,"text":"보험금을 수령하셨더라구요. 저는 잘...","speed":1,"cueUid":"merged-mtegad19-10"},{"index":3,"start":572.786,"end":581.714,"text":"그렇죠, 모르실 거예요. 그때가 두 살 때니까... 아니 세 살. 저기...예?","speed":1,"cueUid":"merged-mtegad19-10"}],"hasShadow":true,"segments":[{"index":0,"start":556.24,"end":563.296,"text":"시어머니요? 그러니까...엄마의 시어머니...유은재씨 할머니죠, 할머니","speed":1,"cueUid":"merged-mtegad19-10"},{"index":1,"start":563.296,"end":566.085,"text":"유은재씨 할머니가 돌아가셨을 때도...","speed":1,"cueUid":"merged-mtegad19-10"},{"index":2,"start":566.085,"end":572.786,"text":"보험금을 수령하셨더라구요. 저는 잘...","speed":1,"cueUid":"merged-mtegad19-10"},{"index":3,"start":572.786,"end":581.714,"text":"그렇죠, 모르실 거예요. 그때가 두 살 때니까... 아니 세 살. 저기...예?","speed":1,"cueUid":"merged-mtegad19-10"}]},{"id":34,"cueNo":35,"displayNo":35,"sourceUid":"merged-mtegeczn-11","uid":"merged-mtegeczn-11","originalCueNo":35,"vi":"Anh muốn nói gì với tôi?\nVấn đề là… Bố dượng của cô vừa bị tai nạn giao thông, đúng không?\nÔng ấy không bị thương nặng.\nVâng, đúng vậy. Thật may mắn.\nNhưng tôi không dám chắc điều đó là may hay rủi.\nTrước đây, bố cô cũng bị tai nạn giao thông.","ko":"그래서 저한테 무슨 말을 하고 싶으신 건지...\n그러니까 그게...이번에 새아버지가...\n교통사고 났죠\n얼마 안 다치셨는데요\n예, 그렇죠. 천만다행으로...\n그게 천만다행인지는 잘 모르겠지만...\n교통사고였죠? 예전에 아버지도...","en":"So what is it that you want to say to me?\nSo... Your stepfather was in a car accident not too long ago, right?\nHe wasn't too badly hurt, though.\nYes, that's right. It's quite a relief.\nBut I'm not sure if that's really a relief...\nas your father was in a car accident as well.","text":"Anh muốn nói gì với tôi?\nVấn đề là… Bố dượng của cô vừa bị tai nạn giao thông, đúng không?\nÔng ấy không bị thương nặng.\nVâng, đúng vậy. Thật may mắn.\nNhưng tôi không dám chắc điều đó là may hay rủi.\nTrước đây, bố cô cũng bị tai nạn giao thông.\\n그래서 저한테 무슨 말을 하고 싶으신 건지...\n그러니까 그게...이번에 새아버지가...\n교통사고 났죠\n얼마 안 다치셨는데요\n예, 그렇죠. 천만다행으로...\n그게 천만다행인지는 잘 모르겠지만...\n교통사고였죠? 예전에 아버지도...\\nSo what is it that you want to say to me?\nSo... Your stepfather was in a car accident not too long ago, right?\nHe wasn't too badly hurt, though.\nYes, that's right. It's quite a relief.\nBut I'm not sure if that's really a relief...\nas your father was in a car accident as well.","koRange":{"start":581.714462,"end":606.846295},"viRange":{"start":538.746826,"end":565.113099},"start":538.746826,"end":606.846295,"koSentenceMarks":[585.686,590.774,592.106,595.009,598.308,601.616,606.846],"koShadowSegments":[{"index":0,"start":581.714462,"end":585.686,"text":"그래서 저한테 무슨 말을 하고 싶으신 건지...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":1,"start":585.686,"end":590.774,"text":"그러니까 그게...이번에 새아버지가...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":2,"start":590.774,"end":592.106,"text":"교통사고 났죠","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":3,"start":592.106,"end":595.009,"text":"얼마 안 다치셨는데요","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":4,"start":595.009,"end":598.308,"text":"예, 그렇죠. 천만다행으로...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":5,"start":598.308,"end":601.616,"text":"그게 천만다행인지는 잘 모르겠지만...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":6,"start":601.616,"end":606.846,"text":"예전에 아버지도...교통사고였죠?","speed":1,"cueUid":"merged-mtegeczn-11"}],"hasShadow":true,"segments":[{"index":0,"start":581.714462,"end":585.686,"text":"그래서 저한테 무슨 말을 하고 싶으신 건지...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":1,"start":585.686,"end":590.774,"text":"그러니까 그게...이번에 새아버지가...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":2,"start":590.774,"end":592.106,"text":"교통사고 났죠","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":3,"start":592.106,"end":595.009,"text":"얼마 안 다치셨는데요","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":4,"start":595.009,"end":598.308,"text":"예, 그렇죠. 천만다행으로...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":5,"start":598.308,"end":601.616,"text":"그게 천만다행인지는 잘 모르겠지만...","speed":1,"cueUid":"merged-mtegeczn-11"},{"index":6,"start":601.616,"end":606.846,"text":"예전에 아버지도...교통사고였죠?","speed":1,"cueUid":"merged-mtegeczn-11"}]},{"id":35,"cueNo":36,"displayNo":36,"sourceUid":"ko-mtcohypd-816","uid":"ko-mtcohypd-816","originalCueNo":36,"vi":"[làm hết cơn ho]","ko":"[헛기침하다]","en":"[clears cough]","text":"[làm hết cơn ho]\\n[헛기침하다]\\n[clears cough]","koRange":null,"viRange":null,"start":608.53,"end":609.5,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":36,"cueNo":37,"displayNo":37,"sourceUid":"merged-mtegn4zk-12","uid":"merged-mtegn4zk-12","originalCueNo":37,"vi":"Chúng tôi tự hỏi tại sao có thể xảy ra tai nạn ở chỗ này\nvì tuy là khúc cua nhưng đường ở đây rất thoáng.\nChỗ này không thường xảy ra tai nạn.\nCô từng đến đó chưa? Chưa.\nVậy là cô chưa đến đó bao giờ.\nCô quý bố hay mẹ hơn? Dạ?\nChuyện là… nếu cô theo mẹ thì sẽ phản bội bố.\nVà nếu cô tin mẹ thì bố cô sẽ giận lắm.","ko":"(보험조사관) 사고 장소가...\n어떻게 이런 데서 사고가 났나 싶게...\n이렇게 커브길이긴 했지만...탁 트인 데다가...\n이런 데서 사고가 날 만한 데가 아닌데...\n혹시 가보셨어요? 아니요\n(보험조사관) 안가보셨구나...\n(보험조사관) 엄마가 좋아요? 아빠가 좋아요? 예?\n그러니까 그게... 어...\n엄마를 따르자니 아빠를 배신하는 거 같고...\n(보험조사관) 엄마를 믿자니 또 아빠가 억울할 거 같고...","en":"We are wondering about the location of the accident\nas it's a curvy but very wide road.\nThis isn't a place where accidents could normally happen.\nHave you been there? No. So you haven't.\nDo you like your mother or father more? What?\nThe thing is... If you believe your mom, you'd be betraying your dad,\nand if you believe your mom, your dad would probably feel upset.","text":"Chúng tôi tự hỏi tại sao có thể xảy ra tai nạn ở chỗ này\nvì tuy là khúc cua nhưng đường ở đây rất thoáng.\nChỗ này không thường xảy ra tai nạn.\nCô từng đến đó chưa? Chưa.\nVậy là cô chưa đến đó bao giờ.\nCô quý bố hay mẹ hơn? Dạ?\nChuyện là… nếu cô theo mẹ thì sẽ phản bội bố.\nVà nếu cô tin mẹ thì bố cô sẽ giận lắm.\\n(보험조사관) 사고 장소가...\n어떻게 이런 데서 사고가 났나 싶게...\n이렇게 커브길이긴 했지만...탁 트인 데다가...\n이런 데서 사고가 날 만한 데가 아닌데...\n혹시 가보셨어요? 아니요\n(보험조사관) 안가보셨구나...\n(보험조사관) 엄마가 좋아요? 아빠가 좋아요? 예?\n그러니까 그게... 어...\n엄마를 따르자니 아빠를 배신하는 거 같고...\n(보험조사관) 엄마를 믿자니 또 아빠가 억울할 거 같고...\\nWe are wondering about the location of the accident\nas it's a curvy but very wide road.\nThis isn't a place where accidents could normally happen.\nHave you been there? No. So you haven't.\nDo you like your mother or father more? What?\nThe thing is... If you believe your mom, you'd be betraying your dad,\nand if you believe your mom, your dad would probably feel upset.","koRange":{"start":606.846295,"end":647.330138},"viRange":{"start":565.113099,"end":605.329904},"start":565.113099,"end":647.330138,"koSentenceMarks":[612.626,615.11,618.263,620.474,623.102,626.654,637.02,639.17,643.911,647.33],"koShadowSegments":[{"index":0,"start":606.846295,"end":612.626,"text":"(보험조사관) 사고 장소가...","speed":1,"cueUid":"merged-mtegn4zk-12"},{"index":1,"start":612.6 n자유의 몸이에요\n잘했어요, 저도 자유의 몸이에요\\nMadame Jung. \"All these reports that say,\n'I dumped him. And I'm available.' aren't true.\nThis is a decision we made together as it goes.\"\nPlease make a sentence with your life again.\nOkay. I dumped my boyfriend.\nI'm available.\nGood job. I'm available too.","koRange":{"start":831.011947,"end":860.093334},"viRange":{"start":752.012074,"end":816.659888},"start":752.012074,"end":860.093334,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":45,"cueNo":46,"displayNo":46,"sourceUid":"merged-mteiukke-21","uid":"merged-mteiukke-21","originalCueNo":46,"vi":"[điện thoại đổ chuông] [nhạc chủ đề bắt đầu]\n[Người hướng dẫn đang giảng dạy bằng tiếng Anh] [Cười]","ko":"[전화 벨소리][테마 음악 시작]\n[강사가 영어로 강의하는 중][웃는다]","en":"[phone rings] [theme music starts]\n[The instructor is lecturing in English] [Laughing]","text":"[điện thoại đổ chuông] [nhạc chủ đề bắt đầu]\n[Người hướng dẫn đang giảng dạy bằng tiếng Anh] [Cười]\\n[전화 벨소리][테마 음악 시작]\n[강사가 영어로 강의하는 중][웃는다]\\n[phone rings] [theme music starts]\n[The instructor is lecturing in English] [Laughing]","koRange":null,"viRange":null,"start":856.7,"end":858.06,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":46,"cueNo":47,"displayNo":47,"sourceUid":"merged-mtf58oi4-1","uid":"merged-mtf58oi4-1","originalCueNo":47,"vi":"Thật á? Trên cả tuyệt vời.\nCậu trúng số à? Tớ á?\nTớ chia tay bạn trai rồi.\nĐã lâu không gặp rồi. Mình gặp nhau đi.\nVậy bao giờ cậu rảnh? Ừ, thứ Bảy á?\nThứ Bảy tớ có hẹn rồi. 5:00 chiều Chủ Nhật được không?\nỪ. Chủ Nhật gặp nha.","ko":"아... 진짜, 완전 대박\n야, 뭐 좋은 일 있어? 나?\n남친이랑 헤어졌어\n그래, 오랜만에 얼굴이나 보자고...\n그래서 언제가 좋아? 응... (정예은) 토요일?\n음... 토요일은 내가 스케줄이 있고\n(정예은) 일요일, 다섯 시 어때?\n(정예은) 오케이, 그럼 그때 봐 응...","en":"Really? That's insane.\nDid something good happen to you? Me?\nI broke up with my boyfriend.\nLet's meet. It's been a while.\nSo, when are you free? Yeah. Saturday?\nI have plans for Saturday. How about Sunday at 5:00 p.m.?\nOkay. See you on Sunday.","text":"Thật á? Trên cả tuyệt vời.\nCậu trúng số à? Tớ á?\nTớ chia tay bạn trai rồi.\nĐã lâu không gặp rồi. Mình gặp nhau đi.\nVậy bao giờ cậu rảnh? Ừ, thứ Bảy á?\nThứ Bảy tớ có hẹn rồi. 5:00 chiều Chủ Nhật được không?\nỪ. Chủ Nhật gặp nha.\\n아... 진짜, 완전 대박\n야, 뭐 좋은 일 있어? 나?\n남친이랑 헤어졌어\n그래, 오랜만에 얼굴이나 보자고...\n그래서 언제가 좋아? 응... (정예은) 토요일?\n음... 토요일은 내가 스케줄이 있고\n(정예은) 일요일, 다섯 시 어때?\n(정예은) 오케이, 그럼 그때 봐 응...\\nReally? That's insane.\nDid something good happen to you? Me?\nI broke up with my boyfriend.\nLet's meet. It's been a while.\nSo, when are you free? Yeah. Saturday?\nI have plans for Saturday. How about Sunday at 5:00 p.m.?\nOkay. See you on Sunday.","koRange":{"start":860.093334,"end":889.19084},"viRange":{"start":816.659888,"end":852.677616},"start":816.659888,"end":889.19084,"koSentenceMarks":[864.215,866.874,868.505,872.574,878.759,884.211,885.743,889.191],"koShadowSegments":[{"index":0,"start":860.093334,"end":864.215,"text":"아... 진짜, 완전 대박","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":1,"start":864.215,"end":866.874,"text":"야, 뭐 좋은 일 있어? 나?","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":2,"start":866.874,"end":868.505,"text":"남친이랑 헤어졌어","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":3,"start":868.505,"end":872.574,"text":"그래, 오랜만에 얼굴이나 보자고...","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":4,"start":872.574,"end":878.759,"text":"그래서 언제가 좋아? 응... (정예은) 토요일?","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":5,"start":878.759,"end":884.211,"text":"음... 토요일은 내가 스케줄이 있고","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":6,"start":884.211,"end":885.743,"text":"(정예은) 일요일, 다섯 시 어때?","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":7,"start":885.743,"end":889.19084,"text":"(정예은) 오케이, 그럼 그때 봐 응...","speed":1,"cueUid":"merged-mtf58oi4-1"}],"hasShadow":true,"segments":[{"index":0,"start":860.093334,"end":864.215,"text":"아... 진짜, 완전 대박","speed":1,"cueUid":"merged-mtf58oi4-1"},{"index":1,"start":864.215,"end":866.874,"text":"야, 뭐 좋은 일 있어 It's so slippery.\nI would wait a bit. Why?\nOh my gosh. I warned you.\nYou're going out again? Yeah. See you later.","koRange":null,"viRange":{"start":852.677616,"end":872.174166},"start":852.677616,"end":872.174166,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":49,"cueNo":50,"displayNo":50,"sourceUid":"merged-mtf5s20b-4","uid":"merged-mtf5s20b-4","originalCueNo":50,"vi":"Có vẻ hơi gồng.\nĐúng vậy. Cậu ấy không chịu nổi việc ở một mình.\nNhững người không biết thu thuế tại nguồn là gì\ncứ xin anh giảm thuế cho họ.\nAnh được nghỉ đúng một cái cuối tuần trong vòng hai tháng từ tháng 4.","ko":"무리하는 거 같지? 응 필사적이야\n잠시도 가만히 못 있겠나 봐\n(남자) 원천징수가 뭔지도 모르는 사람들이 세금만 좀 줄여달라는데...\n4월부터 두 달 동안...","en":"It looks like she's overdoing it.\nYes. She can't be alone even for a second.\nThese people who don't know how withholding taxes work\nkeep asking me to lower the taxes.\nI took an off maybe once on a weekend in the last two months since April.","text":"Có vẻ hơi gồng.\nĐúng vậy. Cậu ấy không chịu nổi việc ở một mình.\nNhững người không biết thu thuế tại nguồn là gì\ncứ xin anh giảm thuế cho họ.\nAnh được nghỉ đúng một cái cuối tuần trong vòng hai tháng từ tháng 4.\\n무리하는 거 같지? 응 필사적이야\n잠시도 가만히 못 있겠나 봐\n(남자) 원천징수가 뭔지도 모르는 사람들이 세금만 좀 줄여달라는데...\n4월부터 두 달 동안...\\nIt looks like she's overdoing it.\nYes. She can't be alone even for a second.\nThese people who don't know how withholding taxes work\nkeep asking me to lower the taxes.\nI took an off maybe once on a weekend in the last two months since April.","koRange":{"start":923.759985,"end":950.268103},"viRange":{"start":881.44253,"end":910.746113},"start":881.44253,"end":950.268103,"koSentenceMarks":[927.726,929.537,947.607,950.268],"koShadowSegments":[{"index":0,"start":923.76,"end":927.726,"text":"무리하는 거 같지? 응 필사적이야","speed":1,"cueUid":"merged-mtf5s20b-4"},{"index":1,"start":927.726,"end":929.537,"text":"잠시도 가만히 못 있겠나 봐","speed":1,"cueUid":"merged-mtf5s20b-4"},{"index":2,"start":929.537,"end":947. ...정여사가 실연해서 난 참 좋아요...에이, 야...","en":"I'm hungry. Let's eat.\nIt's delicious. It's very good.\nCome and eat, Yoon. Yes.\nI am happy about your breakup. Stop it.","text":"Đói quá. Ăn thôi.\nNgon quá. Nhức nách.\nTiền bối Yoon mau đến đây. Ừ.\nTớ rất vui khi quý cô Jung chia tay. Cậu thôi đi.\\n(송지원) 배고파... 이제 먹자. 음! 맛있다!\n(유은재) 맛있어... 윤 선배, 빨리 와요\n(윤진명) 응...정여사가 실연해서 난 참 좋아요...에이, 야...\\nI'm hungry. Let's eat.\nIt's delicious. It's very good.\nCome and eat, Yoon. Yes.\nI am happy about your breakup. Stop it.","koRange":{"start":1000.981462,"end":1019.169},"viRange":{"start":959.541219,"end":977.059612},"start":959.541219,"end":1019.169,"koSentenceMarks":[1004.431,1011.759,1014.428,1015.256,1019.169],"koShadowSegments":[{"index":0,"start":1000.981462,"end":1004.431,"text":"(송지원) 배고파... 이제 먹자","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":1,"start":1004.431,"end":1011.759,"text":"음! 맛있다!","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":2,"start":1011.759,"end":1014.428,"text":"(유은재) 맛있어... 윤 선배, 빨리 와요","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":3,"start":1014.428,"end":1015.256,"text":"(윤진명) 응...","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":4,"start":1015.256,"end":1019.169,"text":"정여사가 실연해서 난 참 좋아요...에이, 야...","speed":1,"cueUid":"merged-mtf6p3yv-7"}],"hasShadow":true,"segments":[{"index":0,"start":1000.981462,"end":1004.431,"text":"(송지원) 배고파... 이제 먹자","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":1,"start":1004.431,"end":1011.759,"text":"음! 맛있다!","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":2,"start":1011.759,"end":1014.428,"text":"(유은재) 맛있어... 윤 선배, 빨리 와요","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":3,"start":1014.428,"end":1015.256,"text":"(윤진명) 응...","speed":1,"cueUid":"merged-mtf6p3yv-7"},{"index":4,"start":1015.256,"end":1019.169,"text":"정여사가 실연해서 난 참 좋아요...에이, 야...","speed":1,"cueUid":"merged-mtf6p3yv-7"}]},{"id":53,"cueNo":54,"displayNo":54,"sourceUid":"merged-mtf6pajp-8","uid":"merged-mtf6pajp-8","originalCueNo":54,"vi":"","ko":"[환호]\n[웃는다]","en":"","text":"[환호]\n[웃는다]","koRange":null,"viRange":null,"start":1016.96,"end":1018.03,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":54,"cueNo":55,"displayNo":55,"sourceUid":"merged-mtf966l9-9","uid":"merged-mtf966l9-9","originalCueNo":55,"vi":"Ngày mai có đứa nào rảnh không?\nChị định mua quần áo nên cần người ngắm giùm.\nQuần áo? Ý chị là thứ làm từ vải để mặc lên người?\nChị được gọi đi phỏng vấn.\nChỗ chị nộp hồ sơ á? Ừ.\nTiền bối Yoon! Hay quá. Tuyệt vời.","ko":"혹시 내일 시간되는 사람 있어?\n내가 옷을 사야되는데... 좀 봐줬으면 해서...옷?\n옻이라면 혹시 그...\n옻나무 할 때 옻?\n면접 보러 오래\n(정예은) 전에 거기? 응\n(송지원) 윤 선배!\n(송지원) 윤 선배\n진짜 잘됐다. 잘됐다! 잘됐다!","en":"Are any of you free tomorrow?\nI need to buy some clothes, and I need someone to help me. Clothes?\nDo you mean the things you wear?\nThey want me to attend an interview.\nThat place that you applied for? Yeah.\nYoon! Awesome. This is great.","text":"Ngày mai có đứa nào rảnh không?\nChị định mua quần áo nên cần người ngắm giùm.\nQuần áo? Ý chị là thứ làm từ vải để mặc lên người?\nChị được gọi đi phỏng vấn.\nChỗ chị nộp hồ sơ á? Ừ.\nTiền bối Yoon! Hay quá. Tuyệt vời.\\n혹시 내일 시간되는 사람 있어?\n내가 옷을 사야되는데... 좀 봐줬으면 해서...옷?\n옻이라면 혹시 그...\n옻나무 할 때 옻?\n면접 보러 오래\n(정예은) 전에 거기? 응\n(송지원) 윤 선배!\n(송지원) 윤 선배\n진짜 잘됐다. 잘됐다! 잘됐다!\\nAre any of you free tomorrow?\nI need to buy some clothes, and I need someone to help me. Clothes?\nDo you mean the things you wear?\nThey want me to attend an interview.\nThat place that you applied for? Yeah.\nYoon! Awesome. This is great.","koRange":{"start":1019.169,"end":1044.271},"viRange":{"start":977.059612,"end":1001.179662},"start":977.059612,"end":1044.271,"koSentenceMarks":[1022.843,1026.895,1029.552,1031.112,1033.394,1036.084,1039.782,1044.271],"koShadowSegments":[{"index":0,"start":1019.169,"end":1022.843,"text":"혹시 내일 시간되는 사람 있어?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":1,"start":1022.843,"end":1026.895,"text":"내가 옷을 사야되는데... 좀 봐줬으면 해서...옷?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":2,"start":1026.895,"end":1029.552,"text":"옻이라면 혹시 그...","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":3,"start":1029.552,"end":1031.112,"text":"옻나무 할 때 옻?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":4,"start":1031.112,"end":1033.394,"text":"면접 보러 오래","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":5,"start":1033.394,"end":1036.084,"text":"(정예은) 전에 거기? 응","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":6,"start":1036.084,"end":1039.782,"text":"(송지원) 윤 선배! (송지원) 윤 선배","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":7,"start":1039.782,"end":1044.271,"text":"진짜 잘됐다. 잘됐다! 잘됐다!","speed":1,"cueUid":"merged-mtf966l9-9"}],"hasShadow":true,"segments":[{"index":0,"start":1019.169,"end":1022.843,"text":"혹시 내일 시간되는 사람 있어?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":1,"start":1022.843,"end":1026.895,"text":"내가 옷을 사야되는데... 좀 봐줬으면 해서...옷?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":2,"start":1026.895,"end":1029.552,"text":"옻이라면 혹시 그...","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":3,"start":1029.552,"end":1031.112,"text":"옻나무 할 때 옻?","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":4,"start":1031.112,"end":1033.394,"text":"면접 보러 오래","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":5,"start":1033.394,"end":1036.084,"text":"(정예은) 전에 거기? 응","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":6,"start":1036.084,"end":1039.782,"text":"(송지원) 윤 선배! (송지원) 윤 선배","speed":1,"cueUid":"merged-mtf966l9-9"},{"index":7,"start":1039.782,"end":1044.271,"text":"진짜 잘됐다. 잘됐다! 잘됐다!","speed":1,"cueUid":"merged-mtf966l9-9"}]},{"id":55,"cueNo":56,"displayNo":56,"sourceUid":"merged-mtf9y1dh-10","uid":"merged-mtf9y1dh-10","originalCueNo":56,"vi":"Chúc mừng chị. Vui quá trời.\nChị còn vòng phỏng vấn mà.\nLúc có thể chúc mừng thì phải triển ngay chứ.\nChúc mừng chị. Chị giỏi lắm.\nTiền bối Yoon được gọi đi phỏng vấn. \nChị ấy đỗ vòng hồ sơ và thi viết rồi. Hay quá rồi. Ngồi đi.\nThật lòng chúc mừng chị. Hái được quả ngọt.\nYi Na à, lại ăn chung nào. Thôi, em ăn rồi.\nVậy thì thôi. Chúc tiền bối Yoon đỗ phỏng vấn. Cạn ly! Chúc mừng chị!","ko":"진짜 축하해요. 아직 면접 남았다니까...\n축하할 수 있을 때 축하해야지...윤 선배, 축하해...\n강 언니, 윤 선배 면접 본대...서류 필기 다 통과했대. 어, 잘됐네...\n(윤진명) 앉어, 앉어, 앉어, 앉어\n(송지원) 진짜 축하해요. 건배합시다\n이나야, 같이 먹자. 아냐, 나 먹고 오는 길이야\n그럼, 우리 먼저. 윤 선배 합격을... 위하여! 축하!","en":"Congrats. This is awesome.\nI still have to pass the interview.\nBut still, we should congratulate you when we can.\nCongrats. It's wonderful.\nYoon got an interview call. She passed all the preliminary stages. That's great. Sit.\nReally, congrats. This is great.\nYi-Na, let's eat together. No, I already ate.\nAll right, then. Let's drink to Yoon's interview. Cheers! Congrats!","text":"Chúc mừng chị. Vui quá trời.\nChị còn vòng phỏng vấn mà.\nLúc có thể chúc mừng thì phải triển ngay chứ.\nChúc mừng chị. Chị giỏi lắm.\nTiền bối Yoon được gọi đi phỏng vấn. \nChị ấy đỗ vòng hồ sơ và thi viết rồi. Hay quá rồi. Ngồi đi.\nThật lòng chúc mừng chị. Hái được quả ngọt.\nYi Na à, lại ăn chung nào. Thôi, em ăn rồi.\nVậy thì thôi. Chúc tiền bối Yoon đỗ phỏng vấn. Cạn ly! Chúc mừng chị!\\n진짜 축하해요. 아직 면접 남았다니까...\n축하할 수 있을 때 축하해야지...윤 선배, 축하해...\n강 언니, 윤 선배 면접 본대...서류 필기 다 통과했대. 어, 잘됐네...\n(윤진명) 앉어, 앉어, 앉어, 앉어\n(송지원) 진짜 축하해요. 건배합시다\n이나야, 같이 먹자. 아냐, 나 먹고 오는 길이야\n그럼, 우리 먼저. 윤 선배 합격을... 위하여! 축하!\\nCongrats. This is awesome.\nI still have to pass the interview.\nBut still, we should congratulate you when we can.\nCongrats. It's wonderful.\nYoon got an interview call. She passed all the preliminary stages. That's great. Sit.\nReally, congrats. This is great.\nYi-Na, let's eat together. No, I already ate.\nAll right, then. Let's drink to Yoon's interview. Cheers! Congrats!","koRange":{"start":1019.169,"end":1072.716184},"viRange":{"start":977.059612,"end":1000.437},"start":977.059612,"end":1072.716184,"koSentenceMarks":[1048.273,1052.792,1059.584,1063.342,1067.323,1072.716],"koShadowSegments":[{"index":0,"start":1019.169,"end":1048.273,"text":"진짜 축하해요. 아직 면접 남았다니까...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":1,"start":1048.273,"end":1052.792,"text":"축하할 수 있을 때 축하해야지...윤 선배, 축하해...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":2,"start":1052.792,"end":1059.584,"text":"강 언니, 윤 선배 면접 본대...서류 필기 다 통과했대. 어, 잘됐네...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":3,"start":1059.584,"end":1063.342,"text":"(윤진명) 앉어, 앉어, 앉어, 앉어","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":4,"start":1063.342,"end":1067.323,"text":"(송지원) 진짜 축하해요. 건배합시다. 이나야, 같이 먹자. 아냐, 나 먹고 오는 길이야","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":5,"start":1067.323,"end":1072.716,"text":"그럼, 우리 먼저. 윤 선배 합격을... 위하여! 축하!","speed":1,"cueUid":"merged-mtf9y1dh-10"}],"hasShadow":true,"segments":[{"index":0,"start":1019.169,"end":1048.273,"text":"진짜 축하해요. 아직 면접 남았다니까...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":1,"start":1048.273,"end":1052.792,"text":"축하할 수 있을 때 축하해야지...윤 선배, 축하해...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":2,"start":1052.792,"end":1059.584,"text":"강 언니, 윤 선배 면접 본대...서류 필기 다 통과했대. 어, 잘됐네...","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":3,"start":1059.584,"end":1063.342,"text":"(윤진명) 앉어, 앉어, 앉어, 앉어","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":4,"start":1063.342,"end":1067.323,"text":"(송지원) 진짜 축하해요. 건배합시다. 이나야, 같이 먹자. 아냐, 나 먹고 오는 길이야","speed":1,"cueUid":"merged-mtf9y1dh-10"},{"index":5,"start":1067.323,"end":1072.716,"text":"그럼, 우리 먼저. 윤 선배 합격을... 위하여! 축하!","speed":1,"cueUid":"merged-mtf9y1dh-10"}]},{"id":56,"cueNo":57,"displayNo":57,"sourceUid":"merged-mtfacr8r-11","uid":"merged-mtfacr8r-11","originalCueNo":57,"vi":"Công ty đó là của nhà nước nhỉ?\nNếu đỗ phỏng vấn thì nửa đời sau an nhàn. Thích quá.\nLương tháng bao nhiêu? Chị vẫn chưa đỗ mà.\nLương một năm ít nhất là 35 triệu won.\nBa mươi lăm triệu một năm?\nNếu được tuyển thì đừng bơ tụi em.\nChị phải mời bọn em ăn mỗi khi thăng chức.\nNếu qua được vòng hồ sơ và thi viết thì coi như đậu rồi.\nĐúng rồi. Mười năm sau, hãy họp hội chị em nhé.","ko":"(정예은) 근데 거기 공기업이잖아\n일단 합격하면 정년 보장!\n흐응... 좋겠다. 연봉은 얼마야?\n아직 합격 아니라니까...\n3천 5백은 넘을걸. 우와!\n(정예은) 3천 5백!\n그때 가서 나 모른 척하면 안 돼\n승진할 때마다 밥 사줘야 돼...\n(정예은) 서류 필기 통과했으면 다 된거나 마찬가지지 뭐\n맞다. 우리 10년 후에 동창회 같은 거 하자","en":"That's a public enterprise, isn't it?\nIf you get the job, you'll be set for life. It's great.\nWhat is the salary? I told you, I'm not hired yet.\nShe'll get at least 35 million won per year!\nThirty five million won per year?\nDon't just ignore us once you get hired.\nYou must take us out every time you get a promotion.\nIf you passed all the preliminary stuff, you're pretty much hired.\nYeah. Let's all have a ten-year reunion.","text":"Công ty đó là của nhà nước nhỉ?\nNếu đỗ phỏng vấn thì nửa đời sau an nhàn. Thích quá.\nLương tháng bao nhiêu? Chị vẫn chưa đỗ mà.\nLương một năm ít nhất là 35 triệu won.\nBa mươi lăm triệu một năm?\nNếu được tuyển thì đừng bơ tụi em.\nChị phải mời bọn em ăn mỗi khi thăng chức.\nNếu qua được vòng hồ sơ và thi viết thì coi như đậu rồi.\nĐúng rồi. Mười năm sau, hãy họp hội chị em nhé.\\n(정예은) 근데 거기 공기업이잖아\n일단 합격하면 정년 보장!\n흐응... 좋겠다. 연봉은 얼마야?\n아직 합격 아니라니까...\n3천 5백은 넘을걸. 우와!\n(정예은) 3천 5백!\n그때 가서 나 모른 척하면 안 돼\n승진할 때마다 밥 사줘야 돼...\n(정예은) 서류 필기 통과했으면 다 된거나 마찬가지지 뭐\n맞다. 우리 10년 후에 동창회 같은 거 하자\\nThat's a public enterprise, isn't it?\nIf you get the job, you'll be set for life. It's great.\nWhat is the salary? I told you, I'm not hired yet.\nShe'll get at least 35 million won per year!\nThirty five million won per year?\nDon't just ignore us once you get hired.\nYou must take us out every time you get a promotion.\nIf you passed all the preliminary stuff, you're pretty much hired.\nYeah. Let's all have a ten-year reunion.","koRange":{"start":1072.716184,"end":1099.051235},"viRange":{"start":1000.437,"end":1058.030451},"start":1000.437,"end":1099.051235,"koSentenceMarks":[1077.378,1079.566,1082.704,1084.236,1088.204,1090.299,1092.398,1095.76,1099.051],"koShadowSegments":[{"index":0,"start":1072.716184,"end":1077.378,"text":"(정예은) 근데 거기 공기업이잖아","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":1,"start":1077.296,"end":1079.566,"text":"일단 합격하면 정년 보장!","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":2,"start":1079.566,"end":1082.704,"text":"흐응... 좋겠다. 연봉은 얼마야?","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":3,"start":1082.704,"end":1084.236,"text":"아직 합격 아니라니까...","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":4,"start":1084.236,"end":1088.204,"text":"3천 5백은 넘을걸. 우와! (정예은) 3천 5백!","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":5,"start":1088.204,"end":1090.299,"text":"그때 가서 나 모른 척하면 안 돼","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":6,"start":1090.299,"end":1092.398,"text":"승진할 때마다 밥 사줘야 돼...","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":7,"start":1092.398,"end":1095.76,"text":"(정예은) 서류 필기 통과했으면 다 된거나 마찬가지지 뭐","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":8,"start":1095.76,"end":1099.051,"text":"맞다. 우리 10년 후에 동창회 같은 거 하자","speed":1,"cueUid":"merged-mtfacr8r-11"}],"hasShadow":true,"segments":[{"index":0,"start":1072.716184,"end":1077.378,"text":"(정예은) 근데 거기 공기업이잖아","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":1,"start":1077.296,"end":1079.566,"text":"일단 합격하면 정년 보장!","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":2,"start":1079.566,"end":1082.704,"text":"흐응... 좋겠다. 연봉은 얼마야?","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":3,"start":1082.704,"end":1084.236,"text":"아직 합격 아니라니까...","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":4,"start":1084.236,"end":1088.204,"text":"3천 5백은 넘을걸. 우와! (정예은) 3천 5백!","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":5,"start":1088.204,"end":1090.299,"text":"그때 가서 나 모른 척하면 안 돼","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":6,"start":1090.299,"end":1092.398,"text":"승진할 때마다 밥 사줘야 돼...","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":7,"start":1092.398,"end":1095.76,"text":"(정예은) 서류 필기 통과했으면 다 된거나 마찬가지지 뭐","speed":1,"cueUid":"merged-mtfacr8r-11"},{"index":8,"start":1095.76,"end":1099.051,"text":"맞다. 우리 10년 후에 동창회 같은 거 하자","speed":1,"cueUid":"merged-mtfacr8r-11"}]},{"id":57,"cueNo":58,"displayNo":58,"sourceUid":"merged-mtfap719-12","uid":"merged-mtfap719-12","originalCueNo":58,"vi":"Chắc sẽ vui lắm nhỉ? Mười năm nữa tớ 32 tuổi. Chưa biết lúc đó thế nào.\nLúc đó, tớ sẽ là tiểu thuyết gia xuất thân nhà báo,\nsẽ bận rộn làm việc với đài truyền hình và nhà xuất bản.\nBọn tớ có thể gặp cậu ở đài truyền hình.\nTớ sẽ là nhà phê bình ẩm thực Jung Ye Eun.\nHy vọng đến lúc đó các chương trình nấu ăn vẫn được yêu thích.","ko":"재밌겠지? 10년 후면 서른 둘...\n그건 좀 곤란한데...\n그때쯤엔 내가 기자 출신 작가가 돼서...\n방송이다, 출판이다 엄청 바쁠 예정이라...\n시간이 나려나 모르겠네\n그럼 방송국에서 만나면 되겠네\n푸드칼럼니스트, 정예은!\n(정예은) 아우, 그때까지 이 쿡방의 인기가 계속돼야 되는데...","en":"It'll be fun, right? In ten years, I'll be 32. I don't know about that.\nBy then, I'll be a journalist-turned-novelist,\nso I'll be busy making public appearances and dealing with publishing companies.\nWe can meet you at the broadcasting station.\nI'll be a food columnist, Ye-Eun Jung.\nI hope cooking shows will be popular by then.","text":"Chắc sẽ vui lắm nhỉ? Mười năm nữa tớ 32 tuổi. Chưa biết lúc đó thế nào.\nLúc đó, tớ sẽ là tiểu thuyết gia xuất thân nhà báo,\nsẽ bận rộn làm việc với đài truyền hình và nhà xuất bản.\nBọn tớ có thể gặp cậu ở đài truyền hình.\nTớ sẽ là nhà phê bình ẩm thực Jung Ye Eun.\nHy vọng đến lúc đó các chương trình nấu ăn vẫn được yêu thích.\\n재밌겠지? 10년 후면 서른 둘...\n그건 좀 곤란한데...\n그때쯤엔 내가 기자 출신 작가가 돼서...\n방송이다, 출판이다 엄청 바쁠 예정이라...\n시간이 나려나 모르겠네\n그럼 방송국에서 만나면 되겠네\n푸드칼럼니스트, 정예은!\n(정예은) 아우, 그때까지 이 쿡방의 인기가 계속돼야 되는데...\\nIt'll be fun, right? In ten years, I'll be 32. I don't know about that.\nBy then, I'll be a journalist-turned-novelist,\nso I'll be busy making public appearances and dealing with publishing companies.\nWe can meet you at the broadcasting station.\nI'll be a food columnist, Ye-Eun Jung.\nI hope cooking shows will be popular by then.","koRange":{"start":1099.051235,"end":1119.83341},"viRange":{"start":1058.030451,"end":1078.921171},"start":1058.030451,"end":1119.83341,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":58,"cueNo":59,"displayNo":59,"sourceUid":"merged-mtfbqakj-16","uid":"merged-mtfbqakj-16","originalCueNo":59,"vi":"Còn em sẽ làm gì? Chuyên gia tư vấn tâm lý?\nChuyên gia tư vấn nhưng sợ người thì mắc cười nhỉ?\n\"Vì sao anh đến đây?\"\nNhưng em sướng thật đấy. 10 năm nữa em mới 30 tuổi thôi. Ừ.\nCòn chị Kang sẽ…\nLàm sao chị biết mười năm nữa mình sẽ ra sao?\nChị không biết ngày mai thế nào mà. Cạn ly! Cạn ly! Chúc mừng chị!","ko":"(정예은) 넌 뭐하고 있을 거야? 음... 심리상담사?\n(송지원) 상담사가 더 낯 가리면 되게 웃기겠다\n(송지원) 어... 어... 어떻게 오셨어요?\n(정예은) 그래도 넌 좋겠다...\n(정예은) 10년 후에도 서른이잖아\n(정예은) 만으로 스물아홉\n그때 되면 강언니는...\n10년 후를 어떻게 아냐?\n당장 내일 무슨 일이 일어날지도 모르는데...\n건배! 건배 합격해서 좋겠다...","en":"What will you be doing? A psychological counselor?\nWouldn't it be funny to have a socially awkward counselor?\n\"So what brings you here?\"\nBut you should be happy. You'll only be 30 in ten years.\nYeah. And Kang will be...\nHow am I supposed to know what will happen in ten years?\nI don't even know what will happen tomorrow.\nCheers! Cheers! Congrats!","text":"Còn em sẽ làm gì? Chuyên gia tư vấn tâm lý?\nChuyên gia tư vấn nhưng sợ người thì mắc cười nhỉ?\n\"Vì sao anh đến đây?\"\nNhưng em sướng thật đấy. 10 năm nữa em mới 30 tuổi thôi. Ừ.\nCòn chị Kang sẽ…\nLàm sao chị biết mười năm nữa mình sẽ ra sao?\nChị không biết ngày mai thế nào mà. Cạn ly! Cạn ly! Chúc mừng chị!\\n(정예은) 넌 뭐하고 있을 거야? 음... 심리상담사?\n(송지원) 상담사가 더 낯 가리면 되게 웃기겠다\n(송지원) 어... 어... 어떻게 오셨어요?\n(정예은) 그래도 넌 좋겠다...\n(정예은) 10년 후에도 서른이잖아\n(정예은) 만으로 스물아홉\n그때 되면 강언니는...\n10년 후를 어떻게 아냐?\n당장 내일 무슨 일이 일어날지도 모르는데...\n건배! 건배 합격해서 좋겠다...\\nWhat will you be doing? A psychological counselor?\nWouldn't it be funny to have a socially awkward counselor?\n\"So what brings you here?\"\nBut you should be happy. You'll only be 30 in ten years.\nYeah. And Kang will be...\nHow am I supposed to know what will happen in ten years?\nI don't even know what will happen tomorrow.\nCheers! Cheers! Congrats!","koRange":{"start":1119.83341,"end":1158.908008} ín đồ thời trang đây rồi. Fashion People.\nChị biết, nhưng em tự nhìn lại mình đi. Tiền bối Yoon, vua tấu hề. Đi nào.\\n(정예은) 3천 5백!아!아...\n빨리 와. 가자! 강언니는? 약속 있대...\n옷 같은 건 강 언니가 잘 볼 거 같은데...\n걱정하지 마. 패피가 있잖아. 패션피플\n그건 아는데...그게 혹시 너야?\n윤 선배! 요 익살꾸러기... (송지원) 가자! 에휴!\n(정예은) 가자 가자...(송지원) 마트로 가자!\\nHere's to a 35 million won salary! This beer is good.\nHurry up. Let's go.\nWhat about Kang? She said she has plans.\nI think Kang would be best for this job.\nDon't you worry. FP is here.\nFashion People.\nI know, but look at what you are wearing. Yoon, you're funny. Let's go.","koRange":{"start":1158.908008,"end":1205.943046},"viRange":{"start":1115.400071,"end":1154.837682},"start":1115.400071,"end":1205.943046,"koSentenceMarks":[1162.829,1178.135,1180.956,1185.533,1189.083,1205.943],"koShadowSegments":[{"index":0,"start":1158.908008,"end":1162.829,"text":"(정예은) 3천 5백!아!아...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":1,"start":1162.829,"end":1178.135,"text":"빨리 와. 가자! 강언니는? 약속 있대...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":2,"start":1178.135,"end":1180.956,"text":"옷 같은 건 강 언니가 잘 볼 거 같은데...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":3,"start":1180.956,"end":1185.533,"text":"걱정하지 마. 패피가 있잖아. 패션피플","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":4,"start":1185.533,"end":1189.083,"text":"그건 아는데...그게 혹시 너야?","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":5,"start":1189.083,"end":1205.943,"text":"윤 선배! 요 익살꾸러기... (송지원) 가자! 에휴! (정예은) 가자 가자...(송지원) 마트로 가자!","speed":1,"cueUid":"merged-mtfczxf9-1"}],"hasShadow":true,"segments":[{"index":0,"start":1158.908008,"end":1162.829,"text":"(정예은) 3천 5백!아!아...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":1,"start":1162.829,"end":1178.135,"text":"빨리 와. 가자! 강언니는? 약속 있대...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":2,"start":1178.135,"end":1180.956,"text":"옷 같은 건 강 언니가 잘 볼 거 같은데...","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":3,"start":1180.956,"end":1185.533,"text":"걱정하지 마. 패피가 있잖아. 패션피플","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":4,"start":1185.533,"end":1189.083,"text":"그건 아는데...그게 혹시 너야?","speed":1,"cueUid":"merged-mtfczxf9-1"},{"index":5,"start":1189.083,"end":1205.943,"text":"윤 선배! 요 익살꾸러기... (송지원) 가자! 에휴! (정예은) 가자 가자...(송지원) 마트로 가자!","speed":1,"cueUid":"merged-mtfczxf9-1"}]},{"id":61,"cueNo":62,"displayNo":62,"sourceUid":"merged-mtfd05og-2","uid":"merged-mtfd05og-2","originalCueNo":62,"vi":"[Cười][Nhạc nền bắt đầu][Cổ vũ]\n[Nhạc nền kết thúc][Nhạc nền sôi động bắt đầu]","ko":"[웃는다][배경 음악 시작][환호]\n[배경 음악 끝][경쾌한 배경 음악 시작]","en":"[Laughing][Background music starts][Cheering]\n[Background music ends][Upbeat background music starts]","text":"[Cười][Nhạc nền bắt đầu][Cổ vũ]\n[Nhạc nền kết thúc][Nhạc nền sôi động bắt đầu]\\n[웃는다][배경 음악 시작][환호]\n[배경 음악 끝][경쾌한 배경 음악 시작]\\n[Laughing][Background music starts][Cheering]\n[Background music ends][Upbeat background music starts]","koRange":null,"viRange":null,"start":1212.03,"end":1213.5,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":62,"cueNo":63,"displayNo":63,"sourceUid":"merged-mtfdgkup-3","uid":"merged-mtfdgkup-3","originalCueNo":63,"vi":"Quý cô Jung. Đắt quá. Tiền bối. Đằng kia.\nĐẠI HẠ GIÁ! SẢN PHẨM HẠ GIÁ THÁNG NÀY\nTiền bối, chị thử bộ này đi. Đẹp nhỉ?\nKính chào quý khách.\nChiếc này, chiếc này và chiếc này. Tôi mặc thử được không? Đẹp đấy. Đây. Chị mặc thử đi.","ko":"(송지원) 정여사!(송지원) 비싸!\n선배...저기... (정예은) 선배! 선배!\n이거 이거... 이거 이쁘지? 어... 어서오세요\n이거, 이거, 이거. 입어 봐도 되죠?\n(정예은) 이쁜데...(유은재) 저기... 이거 한번...","en":"Madame Jung. It's expensive.\nYoon. Over there.\nBIG SALE! SPECIAL PRICE EVENT\nYoon, why don't you try this one? Isn't it pretty? Welcome.\nThis, this, and this. Can I try them on?\nIt's pretty, though. Here. Try this.","text":"Quý cô Jung. Đắt quá. Tiền bối. Đằng kia.\nĐẠI HẠ GIÁ! SẢN PHẨM HẠ GIÁ THÁNG NÀY\nTiền bối, chị thử bộ này đi. Đẹp nhỉ?\nKính chào quý khách.\nChiếc này, chiếc này và chiếc này. Tôi mặc thử được không? Đẹp đấy. Đây. Chị mặc thử đi.\\n(송지원) 정여사!(송지원) 비싸!\n선배...저기... (정예은) 선배! 선배!\n이거 이거... 이거 이쁘지? 어... 어서오세요\n이거, 이거, 이거. 입어 봐도 되죠?\n(정예은) 이쁜데...(유은재) 저기... 이거 한번...\\nMadame Jung. It's expensive.\nYoon. Over there.\nBIG SALE! SPECIAL PRICE EVENT\nYoon, why don't you try this one? Isn't it pretty? Welcome.\nThis, this, and this. Can I try them on?\nIt's pretty, though. Here. Try this.","koRange":null,"viRange":{"start":1154.837682,"end":1274.512801},"start":1154.837682,"end":1274.512801,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":63,"cueNo":64,"displayNo":64,"sourceUid":"merged-mtfdrfa1-6","uid":"merged-mtfdrfa1-6","originalCueNo":64,"vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc chủ đề bắt đầu] [Cổ vũ] [Cười]","ko":"[경쾌한 배경 음악 끝]\n[테마 음악 시작][환호][웃는다]","en":"[Upbeat background music ends]\n[Theme music starts] [Cheering] [Laughing]","text":"[Nhạc nền sôi động kết thúc]\n[Nhạc chủ đề bắt đầu] [Cổ vũ] [Cười]\\n[경쾌한 배경 음악 끝]\n[테마 음악 시작][환호][웃는다]\\n[Upbeat background music ends]\n[Theme music starts] [Cheering] [Laughing]","koRange":{"start":1205.943046,"end":1317.44065},"viRange":null,"start":1205.943046,"end":1317.44065,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":64,"cueNo":65,"displayNo":65,"sourceUid":"merged-mtfdyimh-9","uid":"merged-mtfdyimh-9","originalCueNo":65,"vi":"Em thấy sao? Y chang đồng phục.\nTay áo hơi kì. Đẹp mà chị.\nMua chiếc này nhé?\nEm rất mong tiền bối Yoon đỗ phỏng vấn.\nChị ấy sẽ đậu thôi. Nhỉ? Chị tin là lần này chị ấy sẽ đỗ. Tại sao?\nVì đúng thời điểm.\nNgười ta nói cuộc đời là đồ thị hình Sin.","ko":"어때? 교복도 아니구...이거 팔이 이상해\n이쁜데...이걸로 하자. 진짜 윤 선배 합격했으면 좋겠어요...\n합격할 거야. 그치? 나두. 이번엔 분명해\n왜요? 타이밍 상 그렇잖아\n인생이란 게 왜 오르락 내리락 그런 대잖아","en":"How is this? It looks like a school uniform.\nThe arms are a bit weird. It's pretty. Buy this, okay?\nI really hope that Yoon gets the job. She will.\nYeah? I think she'll really get it this time. Why?\nBecause of the timing.\nThey say life is full of ups and downs.","text":"Em thấy sao? Y chang đồng phục.\nTay áo hơi kì. Đẹp mà chị.\nMua chiếc này nhé?\nEm rất mong tiền bối Yoon đỗ phỏng vấn.\nChị ấy sẽ đậu thôi. Nhỉ? Chị tin là lần này chị ấy sẽ đỗ. Tại sao?\nVì đúng thời điểm.\nNgười ta nói cuộc đời là đồ thị hình Sin.\\n어때? 교복도 아니구...이거 팔이 이상해\n이쁜데...이걸로 하자. 진짜 윤 선배 합격했으면 좋겠어요...\n합격할 거야. 그치? 나두. 이번엔 분명해\n왜요? 타이밍 상 그렇잖아\n인생이란 게 왜 오르락 내리락 그런 대잖아\\nHow is this? It looks like a school uniform.\nThe arms are a bit weird. It's pretty. Buy this, okay?\nI really hope that Yoon gets the job. She will.\nYeah? I think she'll really get it this time. Why?\nBecause of the timing.\nThey say life is full of ups and downs.","koRange":{"start":1317.441,"end":1346.67},"viRange":{"start":1274.512801,"end":1303.421406},"start":1274.512801,"end":1346.67,"koSentenceMarks":[1328.052,1336.182,1340.511,1343.661,1346.67],"koShadowSegments":[{"index":0,"start":1317.441,"end":1328.052,"text":"어때? 교복도 아니구...이거 팔이 이상해","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":1,"start":1328.052,"end":1336.182,"text":"이쁜데...이걸로 하자. 진짜 윤 선배 합격했으면 좋겠어요...","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":2,"start":1336.182,"end":1340.511,"text":"합격할 거야. 그치? 나두. 이번엔 분명해","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":3,"start":1340.511,"end":1343.661,"text":"왜요? 타이밍 상 그렇잖아","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":4,"start":1343.661,"end":1346.67,"text":"인생이란 게 왜 오르락 내리락 그런 대잖아","speed":1,"cueUid":"merged-mtfdyimh-9"}],"hasShadow":true,"segments":[{"index":0,"start":1317.441,"end":1328.052,"text":"어때? 교복도 아니구...이거 팔이 이상해","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":1,"start":1328.052,"end":1336.182,"text":"이쁜데...이걸로 하자. 진짜 윤 선배 합격했으면 좋겠어요...","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":2,"start":1336.182,"end":1340.511,"text":"합격할 거야. 그치? 나두. 이번엔 분명해","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":3,"start":1340.511,"end":1343.661,"text":"왜요? 타이밍 상 그렇잖아","speed":1,"cueUid":"merged-mtfdyimh-9"},{"index":4,"start":1343.661,"end":1346.67,"text":"인생이란 게 왜 오르락 내리락 그런 대잖아","speed":1,"cueUid":"merged-mtfdyimh-9"}]},{"id":65,"cueNo":66,"displayNo":66,"sourceUid":"merged-mtfe2atr-10","uid":"merged-mtfe2atr-10","originalCueNo":66,"vi":"Tiền bối Yoon đã đi xuống mãi rồi nên giờ là lúc chị ấy đi lên.\nTớ không biết đồ thị gì hết,\nnhưng nếu tớ là chủ thì tớ sẽ thuê người làm việc giỏi.\nVà không ai làm việc tốt hơn tiền bối Yoon.\nKhông có đâu. Đào đâu ra. Cậu thấy chưa? \nHồ sơ của chị ấy có thể bị loại vì tuổi tác và kinh nghiệm.\nNhưng chị ấy đã đến vòng phỏng vấn rồi thì sẽ xử đẹp nốt.","ko":"윤 선배는 계속 이랬는데...이제 올라갈 때가 된 거지\n(정예은) 오르막 내리막 그런 건 모르겠고...\n(정예은) 내가 사장이야, 일 잘할 사람 뽑을 거잖아\n(정예은) 윤 선배보다 더 잘할 것 같은 얼굴 있어?\n(송지원) 없지 (유은재) 없어요\n(정예은) 그치?\n(정예은) 나이랑 스펙 때문에 서류에서 떨어질 수는 있어도\n(정예은) 면접까지 갔으면 끝난 거야. 합격이야","en":"Her life is full of downs now, so it's about time that things get better.\nI don't know about ups and downs,\nbut if I were the boss, I'd pick someone who works well.\nAnd there's nobody who would do a better job than Yoon.\nNo, there isn't. Nope, there isn't.\nYou see? She could've been eliminated during the preliminaries\nbecause of her experience and age.\nBut she made it till the interviews, so she will get this job.","text":"Tiền bối Yoon đã đi xuống mãi rồi nên giờ là lúc chị ấy đi lên.\nTớ không biết đồ thị gì hết,\nnhưng nếu tớ là chủ thì tớ sẽ thuê người làm việc giỏi.\nVà không ai làm việc tốt hơn tiền bối Yoon.\nKhông có đâu. Đào đâu ra. Cậu thấy chưa? \nHồ sơ của chị ấy có thể bị loại vì tuổi tác và kinh nghiệm.\nNhưng chị ấy đã đến vòng phỏng vấn rồi thì sẽ xử đẹp nốt.\\n윤 선배는 계속 이랬는데...이제 올라갈 때가 된 거지\n(정예은) 오르막 내리막 그런 건 모르겠고...\n(정예은) 내가 사장이야, 일 잘할 사람 뽑을 거잖아\n(정예은) 윤 선배보다 더 잘할 것 같은 얼굴 있어?\n(송지원) 없지 (유은재) 없어요\n(정예은) 그치?\n(정예은) 나이랑 스펙 때문에 서류에서 떨어질 수는 있어도\n(정예은) 면접까지 갔으면 끝난 거야. 합격이야\\nHer life is full of downs now, so it's about time that things get better.\nI don't know about ups and downs,\nbut if I were the boss, I'd pick someone who works well.\nAnd there's nobody who would do a better job than Yoon.\nNo, there isn't. Nope, there isn't.\nYou see? She could've been eliminated during the preliminaries\nbecause of her experience and age.\nBut she made it till the interviews, so she will get this job.","koRange":{"start":1317.44065,"end":1367.068818},"viRange":{"start":1303.421406,"end":1327.252456},"start":1303.421406,"end":1367.068818,"koSentenceMarks":[1349.549,1352.698,1355.441,1358.19,1360.396,1364.378,1367.069],"koShadowSegments":[{"index":0,"start":1317.441,"end":1349.549,"text":"윤 선배는 계속 이랬는데...이제 올라갈 때가 된 거지","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":1,"start":1349.549,"end":1352.698,"text":"(정예은) 오르막 내리막 그런 건 모르겠고...","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":2,"start":1352.698,"end":1355.441,"text":"(정예은) 내가 사장이야, 일 잘할 사람 뽑을 거잖아","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":3,"start":1355.441,"end":1358.19,"text":"(정예은) 윤 선배보다 더 잘할 것 같은 얼굴 있어?","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":4,"start":1358.19,"end":1360.396,"text":"(송지원) 없지 (유은재) 없어요. (정예은) 그치?","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":5,"start":1360.396,"end":1364.378,"text":"(정예은) 나이랑 스펙 때문에 서류에서 떨어질 수는 있어도","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":6,"start":1364.378,"end":1367.068818,"text":"(정예은) 면접까지 갔으면 끝난 거야. 합격이야","speed":1,"cueUid":"merged-mtfe2atr-10"}],"hasShadow":true,"segments":[{"index":0,"start":1317.441,"end":1349.549,"text":"윤 선배는 계속 이랬는데...이제 올라갈 때가 된 거지","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":1,"start":1349.549,"end":1352.698,"text":"(정예은) 오르막 내리막 그런 건 모르겠고...","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":2,"start":1352.698,"end":1355.441,"text":"(정예은) 내가 사장이야, 일 잘할 사람 뽑을 거잖아","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":3,"start":1355.441,"end":1358.19,"text":"(정예은) 윤 선배보다 더 잘할 것 같은 얼굴 있어?","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":4,"start":1358.19,"end":1360.396,"text":"(송지원) 없지 (유은재) 없어요. (정예은) 그치?","speed":1,"cueUid":"merged-mtfe2atr-10"},{"index":5,"start":1360.396,"end":1364.378,"text":"(정예은) 나이랑 스펙 때문에 서류에서 a'am, over here.\nJesus, you wicked old lady.\nStop laughing. Well, kids would think you are a middle-aged lady.","koRange":{"start":1367.068818,"end":1446.11},"viRange":{"start":1327.252456,"end":1399.872883},"start":1327.252456,"end":1446.11,"koSentenceMarks":[1389.409,1393.556,1398.137,1431.728,1443.059,1446.11],"koShadowSegments":[{"index":0,"start":1367.069,"end":1389.409,"text":"괜찮아? (매장직원) 결제 도와드리겠습니다","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":1,"start":1389.409,"end":1393.556,"text":"(윤진명) 여기... 현금 디씨해줘요","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":2,"start":1393.556,"end":1398.137,"text":"직원가 할인도 해주세요. 잘 부탁드립니다","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":3,"start":1398.137,"end":1431.728,"text":"(동네 아이) 아줌마! 아줌마. 여기요! 여기...","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":4,"start":1431.728,"end":1443.059,"text":"(동네 아이) 아이씨... 마귀 할멈! 아, 웃지 마!","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":5,"start":1443.059,"end":1446.11,"text":"애들 눈으로 보면 아줌마지 뭘...","speed":1,"cueUid":"merged-mtfe8mxs-12"}],"hasShadow":true,"segments":[{"index":0,"start":1367.069,"end":1389.409,"text":"괜찮아? (매장직원) 결제 도와드리겠습니다","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":1,"start":1389.409,"end":1393.556,"text":"(윤진명) 여기... 현금 디씨해줘요","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":2,"start":1393.556,"end":1398.137,"text":"직원가 할인도 해주세요. 잘 부탁드립니다","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":3,"start":1398.137,"end":1431.728,"text":"(동네 아이) 아줌마! 아줌마. 여기요! 여기...","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":4,"start":1431.728,"end":1443.059,"text":"(동네 아이) 아이씨... 마귀 할멈! 아, 웃지 마!","speed":1,"cueUid":"merged-mtfe8mxs-12"},{"index":5,"start":1443.059,"end":1446.11,"text":"애들 눈으로 보면 아줌마지 뭘...","speed":1,"cueUid":"merged-mtfe8mxs-12"}]},{"id":68,"cueNo":69,"displayNo":69,"sourceUid":"merged-mtfeecrb-14","uid":"merged-mtfeecrb-14","originalCueNo":69,"vi":"","ko":"[테마 음악 끝]\n[웃는다]\n[한숨 쉰다]","en":"","text":"[테마 음악 끝]\n[웃는다]\n[한숨 쉰다]","koRange":null,"viRange":{"start":1327.252456,"end":1402.342815},"start":1327.252456,"end":1402.342815,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":69,"cueNo":70,"displayNo":70,"sourceUid":"merged-mtfekqw4-15","uid":"merged-mtfekqw4-15","originalCueNo":70,"vi":"Đợi đến lúc ai đó gọi cậu là ông chú đi.\nHồi cấp ba đã có bà lão gọi tôi như vậy. Tôi bực mình.\nCậu chấp chúng nó làm gì? Con nít mà.\nMột ngày nào đó, tôi sẽ biến thành bà cô thật.\nRồi tôi sẽ trở thành bà lão.\nCậu định trẻ mãi không già à?\nCậu muốn làm quái vật trường sinh bất lão sao?\nCậu quan tâm làm gì? Lạnh ghê.","ko":"너도 아저씨 소리 들어봐...\n난 고등학생 때 이미 아저씨 소리 들었어\n그것도 아줌마한테. 짜증 나...\n뭘 그렇게 신경 써? 애들이 한 말 갖고\n(강이나) 언젠가 진짜 아줌마가 될 거 아냐...\n그러다 보면 할머니도 될 거구...\n그럼 넌 안 늙으려고 그랬어?\n영원히 늙지 않는 괴물이 될 거야? 우와! 알게 뭐야. 아 추워","en":"Just wait until someone calls you a middle-aged man.\nWhen I was in high school, an old lady called me that.\nIt pisses me off.\nSome day, I will be a middle-aged woman.\nAnd then, I'll become a grandma too.\nWere you planning on never getting old or something?\nDid you want to become a monster that never grows old?\nWhy do you care? It's cold.","text":"Đợi đến lúc ai đó gọi cậu là ông chú đi.\nHồi cấp ba đã có bà lão gọi tôi như vậy. Tôi bực mình.\nCậu chấp chúng nó làm gì? Con nít mà.\nMột ngày nào đó, tôi sẽ biến thành bà cô thật.\nRồi tôi sẽ trở thành bà lão.\nCậu định trẻ mãi không già à?\nCậu muốn làm quái vật trường sinh bất lão sao?\nCậu quan tâm làm gì? Lạnh ghê.\\n너도 아저씨 소리 들어봐...\n난 고등학생 때 이미 아저씨 소리 들었어\n그것도 아줌마한테. 짜증 나...\n뭘 그렇게 신경 써? 애들이 한 말 갖고\n(강이나) 언젠가 진짜 아줌마가 될 거 아냐...\n그러다 보면 할머니도 될 거구...\n그럼 넌 안 늙으려고 그랬어?\n영원히 늙지 않는 괴물이 될 거야? 우와! 알게 뭐야. 아 추워\\nJust wait until someone calls you a middle-aged man.\nWhen I was in high school, an old lady called me that.\nIt pisses me off.\nSome day, I will be a middle-aged woman.\nAnd then, I'll become a grandma too.\nWere you planning on never getting old or something?\nDid you want to become a monster that never grows old?\nWhy do you care? It's cold.","koRange":{"start":1446.11,"end":1475.691426},"viRange":{"start":1402.342815,"end":1426.851568},"start":1402.342815,"end":1475.691426,"koSentenceMarks":[1449.459,1453.679,1456.207,1462.515,1464.839,1466.772,1475.691],"koShadowSegments":[{"index":0,"start":1446.11,"end":1449.459,"text":"너도 아저씨 소리 들어봐...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":1,"start":1449.459,"end":1453.679,"text":"난 고등학생 때 이미 아저씨 소리 들었어 그것도 아줌마한테. 짜증 나...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":2,"start":1453.679,"end":1456.207,"text":"뭘 그렇게 신경 써? 애들이 한 말 갖고","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":3,"start":1456.207,"end":1462.515,"text":"(강이나) 언젠가 진짜 아줌마가 될 거 아냐...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":4,"start":1462.515,"end":1464.839,"text":"그러다 보면 할머니도 될 거구...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":5,"start":1464.839,"end":1466.772,"text":"그럼 넌 안 늙으려고 그랬어?","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":6,"start":1466.772,"end":1475.691,"text":"영원히 늙지 않는 괴물이 될 거야? 우와! 알게 뭐야. 아 추워","speed":1,"cueUid":"merged-mtfekqw4-15"}],"hasShadow":true,"segments":[{"index":0,"start":1446.11,"end":1449.459,"text":"너도 아저씨 소리 들어봐...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":1,"start":1449.459,"end":1453.679,"text":"난 고등학생 때 이미 아저씨 소리 들었어 그것도 아줌마한테. 짜증 나...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":2,"start":1453.679,"end":1456.207,"text":"뭘 그렇게 신경 써? 애들이 한 말 갖고","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":3,"start":1456.207,"end":1462.515,"text":"(강이나) 언젠가 진짜 아줌마가 될 거 아냐...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":4,"start":1462.515,"end":1464.839,"text":"그러다 보면 할머니도 될 거구...","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":5,"start":1464.839,"end":1466.772,"text":"그럼 넌 안 늙으려고 그랬어?","speed":1,"cueUid":"merged-mtfekqw4-15"},{"index":6,"start":1466.772,"end":1475.691,"text":"영원히 늙지 않는 괴물이 될 거야? 우와! 알게 뭐야. 아 추워","speed":1,"cueUid":"merged-mtfekqw4-15"}]},{"id":70,"cueNo":71,"displayNo":71,"sourceUid":"merged-mtff877e-18","uid":"merged-mtff877e-18","originalCueNo":71,"vi":"Ông chú đó thế nào rồi? Thế là tôi… đã giết con gái chú.\nChú. Chú cũng sẽ giết tôi chứ? Đi đi. Cô đi đi.\nChú ơi. Cút ngay! Cô bị điếc à? Biến khỏi đây ngay!\nMọi chuyện đã được giải quyết.\nTôi không cần gặp ông ấy nữa.","ko":"(서동주) 아, 그 아저씬 어떻게 됐어?\n(강이나) 그러니까 내가...\n아저씨 딸 죽였어. 아저씨...나도 죽일 거예요? 가! 제발 가라구... 꺼지라구!\n내 말 안 들려! 당장 사라져!\n(강이나) 잘 해결됐어. 이제 볼 일 없을 거야","en":"Why are you still thinking about it? They are just kids.\nSo what happened with that guy?\nSo... I killed your daughter. Mister.\nAre you going to kill me too? Go away. Please leave.\nSir. Get lost! Didn't you hear? Get out of here!\nEverything worked out well.\nNo need to see him any more.","text":"Ông chú đó thế nào rồi? Thế là tôi… đã giết con gái chú.\nChú. Chú cũng sẽ giết tôi chứ? Đi đi. Cô đi đi.\nChú ơi. Cút ngay! Cô bị điếc à? Biến khỏi đây ngay!\nMọi chuyện đã được giải quyết.\nTôi không cần gặp ông ấy nữa.\\n(서동주) 아, 그 아저씬 어떻게 됐어?\n(강이나) 그러니까 내가...\n아저씨 딸 죽였어. 아저씨...나도 죽일 거예요? 가! 제발 가라구... 꺼지라구!\n내 말 안 들려! 당장 사라져!\n(강이나) 잘 해결됐어. 이제 볼 일 없을 거야\\nWhy are you still thinking about it? They are just kids.\nSo what happened with that guy?\nSo... I killed your daughter. Mister.\nAre you going to kill me too? Go away. Please leave.\nSir. Get lost! Didn't you hear? Get out of here!\nEverything worked out well.\nNo need to see him any more.","koRange":{"start":1475.691426,"end":1563.555646},"viRange":{"start":1438.599,"end":1517.021817},"start":1438.599,"end":1563.555646,"koSentenceMarks":[1490.407,1499.164,1546.065,1563.556],"koShadowSegments":[{"index":0,"start":1475.691426,"end":1490.407,"text":"(서동주) 아, 그 아저씬 어떻게 됐어?","speed":1,"cueUid":"merged-mtff877e-18"},{"index":1,"start":1490.407,"end":1499.164,"text":"(강이나) 그러니까 내가...아저씨 딸 죽였어.","speed":1,"cueUid":"merged-mtff877e-18"},{"index":2,"start":1499.164,"end":1546.065,"text":"아저씨...나도 죽일 거예요? 가! 제발 가라구... 꺼지라구! 내 말 안 들려! 당장 사라져!","speed":1,"cueUid":"merged-mtff877e-18"},{"index":3,"start":1546.065,"end":1563.555646,"text":"(강이나) 잘 해결됐어. 이제 볼 일 없을 거야","speed":1,"cueUid":"merged-mtff877e-18"}],"hasShadow":true,"segments":[{"index":0,"start":1475.691426,"end":1490.407,"text":"(서동주) 아, 그 아저씬 어떻게 됐어?","speed":1,"cueUid":"merged-mtff877e-18"},{"index":1,"start":1490.407,"end":1499.164,"text":"(강이나) 그러니까 내가...아저씨 딸 죽였어.","speed":1,"cueUid":"merged-mtff877e-18"},{"index":2,"start":1499.164,"end":1546.065,"text":"아저씨...나도 죽일 거예요? 가! 제발 가라구... 꺼지라구! 내 말 안 들려! 당장 사라져!","speed":1,"cueUid":"merged-mtff877e-18"},{"index":3,"start":1546.065,"end":1563.555646,"text":"(강이나) 잘 해결됐어. 이제 볼 일 없을 거야","speed":1,"cueUid":"merged-mtff877e-18"}]},{"id":71,"cueNo":72,"displayNo":72,"sourceUid":"merged-mtff9k9b-19","uid":"merged-mtff9k9b-19","originalCueNo":72,"vi":"[Nhạc nền bắt đầu] [Thở nặng nề]\n[Tiếng mở cửa] [Tiếng đóng cửa]","ko":"[배경 음악 시작][거친 숨소리]\n[문 여는 소리][문 닫는 소리]","en":"[Background music starts] [Heavy breathing]\n[Sound of door opening][Sound of door closing]","text":"[Nhạc nền bắt đầu] [Thở nặng nề]\n[Tiếng mở cửa] [Tiếng đóng cửa]\\n[배경 음악 시작][거친 숨소리]\n[문 여는 소리][문 닫는 소리]\\n[Background music starts] [Heavy breathing]\n[Sound of door opening][Sound of door closing]","koRange":null,"viRange":null,"start":1556.33,"end":1557.26,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":72,"cueNo":73,"displayNo":73,"sourceUid":"merged-mtffxakg-22","uid":"merged-mtffxakg-22","originalCueNo":73,"vi":"Gương mặt cậu sao vậy? Mặt tôi làm sao? Đi ăn nhé?\nKhông được. Tôi phải làm việc.\nSao từ đầu không nói vậy đi.\nChị định đi đâu à? Ừ. Chuyến bay dài quá nhỉ?\nThích thật. Gì vậy trời? Mới mở máy thôi mà.\nSao thế? Chuyện gì vậy?","ko":"근데 얼굴이 왜 그래? 내 얼굴이 뭐?\n밥 먹으러 가자. 안 돼. 나 일하러 가야 돼\n에이 씨... 진작 말을 하든가. 어디가? 응\n힘들었지? 어, 뭐야? 핸드폰 켜자 마자... 왜? 무슨 일 있어? 어?","en":"What's with your face then? What about it? Let's eat.\nI can't. I have to work.\nYou should have said that earlier.\nAre you going somewhere? Yeah.\nWasn't the flight very long? It's nice.\nWhat the heck. I just turned on my phone. What is it? What's going on?","text":"Gương mặt cậu sao vậy? Mặt tôi làm sao? Đi ăn nhé?\nKhông được. Tôi phải làm việc.\nSao từ đầu không nói vậy đi.\nChị định đi đâu à? Ừ. Chuyến bay dài quá nhỉ?\nThích thật. Gì vậy trời? Mới mở máy thôi mà.\nSao thế? Chuyện gì vậy?\\n근데 얼굴이 왜 그래? 내 얼굴이 뭐?\n밥 먹으러 가자. 안 돼. 나 일하러 가야 돼\n에이 씨... 진작 말을 하든가. 어디가? 응\n힘들었지? 어, 뭐야? 핸드폰 켜자 마자... 왜? 무슨 일 있어? 어?\\nWhat's with your face then? What about it? Let's eat.\nI can't. I have to work.\nYou should have said that earlier.\nAre you going somewhere? Yeah.\nWasn't the flight very long? It's nice.\nWhat the heck. I just turned on my phone. What is it? What's going on?","koRange":{"start":1563.555646,"end":1634.789162},"viRange":{"start":1517.021817,"end":1585.625173},"start":1517.021817,"end":1634.789162,"koSentenceMarks":[1567.881,1572.072,1577.972,1634.789],"koShadowSegments":[{"index":0,"start":1563.556,"end":1567.881,"text":"근데 얼굴이 왜 그래? 내 얼굴이 뭐?","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":1,"start":1567.881,"end":1572.072,"text":"밥 먹으러 가자. 안 돼. 나 일하러 가야 돼","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":2,"start":1572.072,"end":1577.972,"text":"에이 씨... 진작 말을 하든가.","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":3,"start":1594.16,"end":1634.789,"text":"어디가? 응. 힘들었지? 어, 뭐야? 핸드폰 켜자 마자... 왜? 무슨 일 있어? 어?","speed":1,"cueUid":"merged-mtffxakg-22"}],"hasShadow":true,"segments":[{"index":0,"start":1563.556,"end":1567.881,"text":"근데 얼굴이 왜 그래? 내 얼굴이 뭐?","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":1,"start":1567.881,"end":1572.072,"text":"밥 먹으러 가자. 안 돼. 나 일하러 가야 돼","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":2,"start":1572.072,"end":1577.972,"text":"에이 씨... 진작 말을 하든가.","speed":1,"cueUid":"merged-mtffxakg-22"},{"index":3,"start":1594.16,"end":1634.789,"text":"어디가? 응. 힘들었지? 어, 뭐야? 핸드폰 켜자 마자... 왜? 무슨 일 있어? 어?","speed":1,"cueUid":"merged-mtffxakg-22"}]},{"id":73,"cueNo":74,"displayNo":74,"sourceUid":"merged-mtffxqb2-24","uid":"merged-mtffxqb2-24","originalCueNo":74,"vi":"[Nhạc nền kết thúc] [Tiếng đóng cửa]\n[Thở dài][Nhấn]","ko":"[배경 음악 끝][문 닫는 소리]\n[한숨 쉰다][탁]\n[전화 벨소리]","en":"[Background music ends] [Sound of door closing]\n[Sighs][Tap]","text":"[Nhạc nền kết thúc] [Tiếng đóng cửa]\n[Thở dài][Nhấn]\\n[배경 음악 끝][문 닫는 소리]\n[한숨 쉰다][탁]\n[전화 벨소리]\\n[Background music ends] [Sound of door closing]\n[Sighs][Tap]","koRange":null,"viRange":null,"start":1635.13,"end":1637.76,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":74,"cueNo":75,"displayNo":75,"sourceUid":"merged-mtfvfcmj-2","uid":"merged-mtfvfcmj-2","originalCueNo":75,"vi":"Em nghĩ Eun Jae đã gặp chuyện gì đó.\nChào cô. Rồi sao? Mẹ nói gì với anh ta?\nAnh ta nói gì? Mẹ kể chuyện đó làm gì?\nMẹ nghĩ họ sẽ nghĩ gì nếu biết mẹ quen bố dượng trước khi bố chết?\nMẹ nói dối kiểu gì vậy? Chỉ biết mặt thì sao gọi là quen biết được?\nCon đã dặn mẹ gọi cho con trước.\nVì sao mẹ ra nước ngoài khi vừa nhận tiền bảo hiểm?","ko":"은재한테 무슨 일 있는 것 같은데...\n(보험조사관) 저기...그래서? 엄마가 뭐라 그랬는데? 그랬더니 뭐래?\n그런 얘긴 왜 해?\n아빠 죽기 전부터 새아빠 알고 있었다면 그 사람들이 무슨 생각할 것 같애?\n그게 무슨 거짓말이야...얼굴만 아는 게 뭘 아는 사이야?\n그러게 나한테 전화부터 하랬잖아 보험금 받자마자 해외여행이나 가고, 도대체가...","en":"I think something happened to Eun-Jae!\nExcuse me. So, what did you tell him?\nWhat did he say then? Why did you say that?\nWhat do you think they'd think\nif they came to know that dad knew about it before he died?\nHow is that a lie? Knowing how they look doesn't make you an acquaintance!\nThat's why I told you to call me first.\nWhy did you go on a trip as soon as you got the insurance money?","text":"Em nghĩ Eun Jae đã gặp chuyện gì đó.\nChào cô. Rồi sao? Mẹ nói gì với anh ta?\nAnh ta nói gì? Mẹ kể chuyện đó làm gì?\nMẹ nghĩ họ sẽ nghĩ gì nếu biết mẹ quen bố dượng trước khi bố chết?\nMẹ nói dối kiểu gì vậy? Chỉ biết mặt thì sao gọi là quen biết được?\nCon đã dặn mẹ gọi cho con trước.\nVì sao mẹ ra nước ngoài khi vừa nhận tiền bảo hiểm?\\n은재한테 무슨 일 있는 것 같은데...\n(보험조사관) 저기...그래서? 엄마가 뭐라 그랬는데? 그랬더니 뭐래?\n그런 얘긴 왜 해?\n아빠 죽기 전부터 새아빠 알고 있었다면 그 사람들이 무슨 생각할 것 같애?\n그게 무슨 거짓말이야...얼굴만 아는 게 뭘 아는 사이야?\n그러게 나한테 전화부터 하랬잖아 보험금 받자마자 해외여행이나 가고, 도대체가...\\nI think something happened to Eun-Jae!\nExcuse me. So, what did you tell him?\nWhat did he say then? Why did you say that?\nWhat do you think they'd think\nif they came to know that dad knew about it before he died?\nHow is that a lie? Knowing how they look doesn't make you an acquaintance!\nThat's why I told you to call me first.\nWhy did you go on a trip as soon as you got the insurance money?","koRange":{"start":1634.789,"end":1683.135},"viRange":{"start":1585.625173,"end":1634.308348},"start":1585.625173,"end":1683.135,"koSentenceMarks":[1656.866,1667.9,1671.598,1676.665,1683.135],"koShadowSegments":[{"index":0,"start":1634.789,"end":1656.866,"text":"은재한테 무슨 일 있는 것 같은데...","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":1,"start":1656.866,"end":1667.9,"text":"(보험조사관) 저기...그래서? 엄마가 뭐라 그랬는데? 그랬더니 뭐래? 그런 얘긴 왜 해?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":2,"start":1667.9,"end":1671.598,"text":"아빠 죽기 전부터 새아빠 알고 있었다면 그 사람들이 무슨 생각할 것 같애?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":3,"start":1671.598,"end":1676.665,"text":"그게 무슨 거짓말이야...얼굴만 아는 게 뭘 아는 사이야?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":4,"start":1676.665,"end":1683.135,"text":"그러게 나한테 전화부터 하랬잖아 보험금 받자마자 해외여행이나 가고, 도대체가...","speed":1,"cueUid":"merged-mtfvfcmj-2"}],"hasShadow":true,"segments":[{"index":0,"start":1634.789,"end":1656.866,"text":"은재한테 무슨 일 있는 것 같은데...","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":1,"start":1656.866,"end":1667.9,"text":"(보험조사관) 저기...그래서? 엄마가 뭐라 그랬는데? 그랬더니 뭐래? 그런 얘긴 왜 해?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":2,"start":1667.9,"end":1671.598,"text":"아빠 죽기 전부터 새아빠 알고 있었다면 그 사람들이 무슨 생각할 것 같애?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":3,"start":1671.598,"end":1676.665,"text":"그게 무슨 거짓말이야...얼굴만 아는 게 뭘 아는 사이야?","speed":1,"cueUid":"merged-mtfvfcmj-2"},{"index":4,"start":1676.665,"end":1683.135,"text":"그러게 나한테 전화부터 하랬잖아 보험금 받자마자 해외여행이나 가고, 도대체가...","speed":1,"cueUid":"merged-mtfvfcmj-2"}]},{"id":75,"cueNo":76,"displayNo":76,"sourceUid":"merged-mtfvz9qw-3","uid":"merged-mtfvz9qw-3","originalCueNo":76,"vi":"Thôi được. Con xin lỗi vì nổi cáu, nhưng…\nMẹ tự xử đi. Tại sao cái gì con cũng phải nói vậy?\nAi mượn mẹ mua lắm bảo hiểm vậy?\nGiờ mẹ mà hủy thì chỉ thêm đáng ngờ thôi.\nMẹ ơi, con có tiết học. Vâng.","ko":"알았어. 화내서 미안한데...\n그건 엄마가 알아서 해야지 일일이 내가 뭐라 그래?\n그러게 누가 보험을 그렇게 많이 들어 놓으래?\n지금 해약하면 더 의심받지\n엄마 나 수업 들어가야 돼. 응...","en":"All right. Sorry I got mad, but...\nYou should take care of it. Do I need to tell you everything?\nSo who told you to get so many insurance plans?\nIf you cancel them, they'll doubt you even more.\nMom, I have to go to my class now. Yes.","text":"Thôi được. Con xin lỗi vì nổi cáu, nhưng…\nMẹ tự xử đi. Tại sao cái gì con cũng phải nói vậy?\nAi mượn mẹ mua lắm bảo hiểm vậy?\nGiờ mẹ mà hủy thì chỉ thêm đáng ngờ thôi.\nMẹ ơi, con có tiết học. Vâng.\\n알았어. 화내서 미안한데...\n그건 엄마가 알아서 해야지 일일이 내가 뭐라 그래?\n그러게 누가 보험을 그렇게 많이 들어 놓으래?\n지금 해약하면 더 의심받지\n엄마 나 수업 들어가야 돼. 응...\\nAll right. Sorry I got mad, but...\nYou should take care of it. Do I need to tell you everything?\nSo who told you to get so many insurance plans?\nIf you cancel them, they'll doubt you even more.\nMom, I have to go to my class now. Yes.","koRange":{"start":1634.789162,"end":1707.798358},"viRange":{"start":1634.308348,"end":1659.04921},"start":1634.308348,"end":1707.798358,"koSentenceMarks":[1687.257,1690.767,1693.997,1698.464,1707.798],"koShadowSegments":[{"index":0,"start":1634.789162,"end":1687.257,"text":"알았어. 화내서 미안한데...","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":1,"start":1687.257,"end":1690.767,"text":"그건 엄마가 알아서 해야지 일일이 내가 뭐라 그래?","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":2,"start":1690.767,"end":1693.997,"text":"그러게 누가 보험을 그렇게 많이 들어 놓으래?","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":3,"start":1693.997,"end":1698.464,"text":"지금 해약하면 더 의심받지","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":4,"start":1698.464,"end":1707.798,"text":"엄마 나 수업 들어가야 돼. 응...","speed":1,"cueUid":"merged-mtfvz9qw-3"}],"hasShadow":true,"segments":[{"index":0,"start":1634.789162,"end":1687.257,"text":"알았어. 화내서 미안한데...","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":1,"start":1687.257,"end":1690.767,"text":"그건 엄마가 알아서 해야지 일일이 내가 뭐라 그래?","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":2,"start":1690.767,"end":1693.997,"text":"그러게 누가 보험을 그렇게 많이 들어 놓으래?","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":3,"start":1693.997,"end":1698.464,"text":"지금 해약하면 더 의심받지","speed":1,"cueUid":"merged-mtfvz9qw-3"},{"index":4,"start":1698.464,"end":1707.798,"text":"엄마 나 수업 들어가야 돼. 응...","speed":1,"cueUid":"merged-mtfvz9qw-3"}]},{"id":76,"cueNo":77,"displayNo":77,"sourceUid":"merged-mtfw4yc6-6","uid":"merged-mtfw4yc6-6","originalCueNo":77,"vi":"Tình hình có vẻ căng. Chuyện gì vậy?\nKhông có gì. Em phải lên lớp rồi.\nChúc ngon miệng. Khoan. Đừng đụng vào. Tớ cúng điện thoại đã.\nCậu tính gửi cho ai mà tích cực chụp vậy?\nĐây là kỷ niệm của tớ. Một chương của tuổi trẻ.\nCậu có thể đổi trích dẫn trên trang cá nhân không? Nó có vấn đề gì à?","ko":"되게 심각하네... 무슨 일 있어? 아뇨... 저, 강의시간이...\n(직원) 맛있게 드세요. 아, 잠깐 잠깐, 안 돼. 사진 먼저 찍고\n아휴... 누구 보라고 저렇게 열심이신지...\n기록이야. 기록! 내 청춘의 한 페이지!\n(정예은 친구) 그... 대문 글 좀 바꾸면 안 돼? 그게 왜?","en":"Seems quite serious. What's going on?\nNothing. I have a class to go to.\nEnjoy. Wait. Not yet. Let me take a photo first.\nWho do you want to show it to?\nThese are my memories. A page from my youth.\nCan't you change the blurb on your profile? Why?","text":"Tình hình có vẻ căng. Chuyện gì vậy?\nKhông có gì. Em phải lên lớp rồi.\nChúc ngon miệng. Khoan. Đừng đụng vào. Tớ cúng điện thoại đã.\nCậu tính gửi cho ai mà tích cực chụp vậy?\nĐây là kỷ niệm của tớ. Một chương của tuổi trẻ.\nCậu có thể đổi trích dẫn trên trang cá nhân không? Nó có vấn đề gì à?\\n되게 심각하네... 무슨 일 있어? 아뇨... 저, 강의시간이...\n(직원) 맛있게 드세요. 아, 잠깐 잠깐, 안 돼. 사진 먼저 찍고\n아휴... 누구 보라고 저렇게 열심이신지...\n기록이야. 기록! 내 청춘의 한 페이지!\n(정예은 친구) 그... 대문 글 좀 바꾸면 안 돼? 그게 왜?\\nSeems quite serious. What's going on?\nNothing. I have a class to go to.\nEnjoy. Wait. Not yet. Let me take a photo first.\nWho do you want to show it to?\nThese are my memories. A page from my youth.\nCan't you change the blurb on your profile? Why?","koRange":{"start":1713.893454,"end":1756.091912},"viRange":{"start":1665.122946,"end":1708.912878},"start":1665.122946,"end":1756.091912,"koSentenceMarks":[1723.144,1742.546,1749.185,1751.765,1756.092],"koShadowSegments":[{"index":0,"start":1713.893454,"end":1723.144,"text":"되게 심각하네... 무슨 일 있어? 아뇨... 저, 강의시간이...","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":1,"start":1737.029,"end":1742.546,"text":"(직원) 맛있게 드세요. 아, 잠깐 잠깐, 안 돼. 사진 먼저 찍고","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":2,"start":1745.422,"end":1749.185,"text":"아휴... 누구 보라고 저렇게 열심이신지...","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":3,"start":1749.185,"end":1751.765,"text":"기록이야. 기록! 내 청춘의 한 페이지!","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":4,"start":1751.765,"end":1756.091912,"text":"(정예은 친구) 그... 대문 글 좀 바꾸면 안 돼? 그게 왜?","speed":1,"cueUid":"merged-mtfw4yc6-6"}],"hasShadow":true,"segments":[{"index":0,"start":1713.893454,"end":1723.144,"text":"되게 심각하네... 무슨 일 있어? 아뇨... 저, 강의시간이...","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":1,"start":1737.029,"end":1742.546,"text":"(직원) 맛있게 드세요. 아, 잠깐 잠깐, 안 돼. 사진 먼저 찍고","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":2,"start":1745.422,"end":1749.185,"text":"아휴... 누구 보라고 저렇게 열심이신지...","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":3,"start":1749.185,"end":1751.765,"text":"기록이야. 기록! 내 청춘의 한 페이지!","speed":1,"cueUid":"merged-mtfw4yc6-6"},{"index":4,"start":1751.765,"end":1756.091912,"text":"(정예은 친구) 그... 대문 글 좀 바꾸면 안 돼? 그게 왜?","speed":1,"cueUid":"merged-mtfw4yc6-6"}]},{"id":77,"cueNo":78,"displayNo":78,"sourceUid":"merged-mtfx76rw-7","uid":"merged-mtfx76rw-7","originalCueNo":78,"vi":"[Nhạc nền sôi động bắt đầu]\n[Nhấp chuột][Chà]","ko":"[경쾌한 배경 음악 시작]\n[찰칵][우웩]","en":"[Upbeat background music starts]\n[Click][Wow]","text":"[Nhạc nền sôi động bắt đầu]\n[Nhấp chuột][Chà]\\n[경쾌한 배경 음악 시작]\n[찰칵][우웩]\\n[Upbeat background music starts]\n[Click][Wow]","koRange":null,"viRange":null,"start":1758.63,"end":1759.56,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":78,"cueNo":79,"displayNo":79,"sourceUid":"merged-mtfx9do7-8","uid":"merged-mtfx9do7-8","originalCueNo":79,"vi":"Như chú lạc đà băng qua sa mạc. Ý cậu là gì?\nUng dung đi trên con đường của chính mình.\nNghe như thể cậu đã lung lay từ giây phút viết câu đó.\nMai đến phố Gyeongidan nhé.\nTớ nghe nói họ bán món bánh mocha ngon thứ nhì ở nước ta.","ko":"(정예은) 사막을 걷는 낙타처럼...그렇게...\n아니, 그렇게가 어떻겐데?\n뚜벅 뚜벅 내 길을 걸어 가겠다 이거지...흔들리지 않고...\n그런 걸 쓰는 순간부터 흔들린 것 같은데...\n내일은 경리단길 가자\n거기 우리나라에서 두 번째로 맛있는 모카케잌 판대","en":"Like a camel walking through the desert. What do you mean?\nWalking my path without getting distracted.\nSounds like you're already distracted.\nLet's go to Gyeongnidan-gil tomorrow.\nI've heard that they sell the second most delicious mocha cake in Korea.","text":"Như chú lạc đà băng qua sa mạc. Ý cậu là gì?\nUng dung đi trên con đường của chính mình.\nNghe như thể cậu đã lung lay từ giây phút viết câu đó.\nMai đến phố Gyeongidan nhé.\nTớ nghe nói họ bán món bánh mocha ngon thứ nhì ở nước ta.\\n(정예은) 사막을 걷는 낙타처럼...그렇게...\n아니, 그렇게가 어떻겐데?\n뚜벅 뚜벅 내 길을 걸어 가겠다 이거지...흔들리지 않고...\n그런 걸 쓰는 순간부터 흔들린 것 같은데...\n내일은 경리단길 가자\n거기 우리나라에서 두 번째로 맛있는 모카케잌 판대\\nLike a camel walking through the desert. What do you mean?\nWalking my path without getting distracted.\nSounds like you're already distracted.\nLet's go to Gyeongnidan-gil tomorrow.\nI've heard that they sell the second most delicious mocha cake in Korea.","koRange":{"start":1756.092,"end":1777.998},"viRange":{"start":1708.912878,"end":1730.867163},"start":1708.912878,"end":1777.998,"koSentenceMarks":[1760.141,1763.873,1767.684,1773.398,1775.038,1777.998],"koShadowSegments":[{"i at's why there's something wrong.\nIt doesn't make sense that she is happy right after a breakup.\nAre you okay? What's the matter? You took it so well until now.","text":"Jung Ye Eun! Quý cô Jung! Mở cửa ra!\nChị ấy yêu đời lắm. Đây này. Vậy mới đáng nghi.\nThất tình mà vui mới là có vấn đề đấy. \nCậu không sao chứ? Sao thế?\nCậu đã gắng gượng đến tận bây giờ.\\n정예은! 정여사! 문 열어! 아, 이 미친 게...\n어떡해요? 좀 아까까지 기분 좋았는데... \n그러니까 이상한 거지...\n실연했는데 기분이 좋다는 게 말이 돼?\n괜찮아? 왜 그래? 지금까지 잘 견뎠잖아...\\nYe-Eun! Madame Jung! Open the door!\nShe was in a good mood. Hey, here.\nThat's why there's something wrong.\nIt doesn't make sense that she is happy right after a breakup.\nAre you okay? What's the matter? You took it so well until now.","koRange":{"start":1853.918,"end":1877.229},"viRange":{"start":1805.92541,"end":1828.312349},"start":1805.92541,"end":1877.229,"koSentenceMarks":[1862.106,1868.478,1877.229],"koShadowSegments":[{"index":0,"start":1853.918,"end":1862.106,"text":"정예은! 정여사! 문 열어! 아, 이 미친 게...어떡해요? 좀 아까까지 기분 좋았는데...","speed":1,"cueUid":"merged-mtfxn9vw-13"},{"index":1,"start":1862.106,"end":1868.478,"text":"그러니까 이상한 거지...실연했는데 기분이 좋다는 게 말이 돼?","speed":1,"cueUid":"merged-mtfxn9vw-13"},{"index":2,"start":1868.478,"end":1877.229,"text":"괜찮아? 왜 그래? 지금까지 잘 견뎠잖아...","speed":1,"cueUid":"merged-mtfxn9vw-13"}],"hasShadow":true,"segments":[{"index":0,"start":1853.918,"end":1862.106,"text":"정예은! 정여사! 문 열어! 아, 이 미친 게...어떡해요? 좀 아까까지 기분 좋았는데...","speed":1,"cueUid":"merged-mtfxn9vw-13"},{"index":1,"start":1862.106,"end":1868.478,"text":"그러니까 이상한 거지...실연했는데 기분이 좋다는 게 말이 돼?","speed":1,"cueUid":"merged-mtfxn9vw-13"},{"index":2,"start":1868.478,"end":1877.229,"text":"괜찮아? 왜 그래? 지금까지 잘 견뎠잖아...","speed":1,"cueUid":"merged-mtfxn9vw-13"}]},{"id":84,"cueNo":85,"displayNo":85,"sourceUid":"merged-mtfxnfog-14","uid":"merged-mtfxnfog-14","originalCueNo":85,"vi":"[Tiếng mở cửa]\n[Nhạc nền kết thúc]","ko":"[문 여는 소리]\n[배경 음악 끝]","en":"[Sound of door opening]\n[Background music ends]","text":"[Tiếng mở c
