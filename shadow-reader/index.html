 hai triệu won chỉ trong một ngày.\nCô nghĩ cô đáng giá ngần đó tiền à?","ko":"바빠서 아이한테 잠깐 신경을 못 썼더니... 뭔가 오해하고 계신 거 같은데요\n전 오빠랑 결혼 같은 거 할 생각 없어요\n그러니까 걱정 같은 거 하지 마세요\n아이 거봐, 내가 그랬잖아...우리 그런 사이 아니라고...\n그냥 만나는 거야...재미 삼아\n(장선호엄마) 즐기는 거면 기준을 정해야지\n결혼할 생각은 아니라니까 됐고\n(장선호엄마) 서로 주고받는 사이로 합의는 본 것 같은데\n왜 룰을 안 지켜요?\n며칠 전에 하루 동안 200만원 넘게 그었던데\n아가씨가 그런 가치가 있다고 생각해요?","en":"I was so busy that I couldn't keepan eye on my son, and now... I think you've misunderstood.\nI have no intention of marrying this man.\nSo you don't need to worry.\nSee, Mom? I told you that we don't have that kind of relationship.\nWe're just dating for fun. You should set the rules for fun.\nYou say that you have no intention of marrying him, which is fine.\nIt looks like you two have a give-and-take relation going on, but why aren't you keeping the rules?\nYou spent more than two million won last week, in just one day.\nDo you really think you're worthy of spending that much of his money?","text":"Tôi bận nên hơi lơ đễnh con cái… Cháu nghĩ là bác đang hiểu lầm.\nCháu không có ý định sẽ lấy anh ấy.\nVậy nên bác không cần lo lắng.\nMẹ thấy chưa? Con đã nói bọn con không phải quan hệ đó mà.\nBọn con quen chơi chơi thôi. Chơi cũng có tiêu chuẩn của chơi.\nCô không định lấy con tôi nên tôi cho qua.\nCó vẻ hai đứa là kiểu có qua có lại nhưng tại sao cô phá luật?\nTuần trước, cô tiêu hơn hai triệu won chỉ trong một ngày.\nCô nghĩ cô đáng giá ngần đó tiền à?\\n바빠서 아이한테 잠깐 신경을 못 썼더니... 뭔가 오해하고 계신 거 같은데요\n전 오빠랑 결혼 같은 거 할 생각 없어요\n그러니까 걱정 같은 거 하지 마세요\n아이 거봐, 내가 그랬잖아...우리 그런 사이 아니라고...\n그냥 만나는 거야...재미 삼아\n(장선호엄마) 즐기는 거면 기준을 정해야지\n결혼할 생각은 아니라니까 됐고\n(장선호엄마) 서로 주고받는 사이로 합의는 본 것 같은데\n왜 룰을 안 지켜요?\n며칠 전에 하루 동안 200만원 넘게 그었던데\n아가씨가 그런 가치가 있다고 생각해요?\\nI was so busy that I couldn't keepan eye on my son, and now... I think you've misunderstood.\nI have no intention of marrying this man.\nSo you don't need to worry.\nSee, Mom? I told you that we don't have that kind of relationship.\nWe're just dating for fun. You should set the rules for fun.\nYou say that you have no intention of marrying him, which is fine.\nIt looks like you two have a give-and-take relation going on, but why aren't you keeping the rules?\nYou spent more than two million won last week, in just one day.\nDo you really think you're worthy of spending that much of his money?","koRange":{"start":2227.269029,"end":2268.235975},"viRange":{"start":2220.971608,"end":2221.552107},"start":2220.971608,"end":2268.235975,"koSentenceMarks":[2235.393,2238.336,2241.718,2244.988,2248.08,2252.68,2255.682,2258.671,2260.299,2265.538,2268.236],"koShadowSegments":[{"index":0,"start":2227.269029,"end":2235.393,"text":"바빠서 아이한테 잠깐 신경을 못 썼더니... 뭔가 오해하고 계신 거 같은데요","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":1,"start":2235.393,"end":2238.336,"text":"전 오빠랑 결혼 같은 거 할 생각 없어요","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":2,"start":2238.336,"end":2241.718,"text":"그러니까 걱정 같은 거 하지 마세요","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":3,"start":2241.718,"end":2244.988,"text":"아이 거봐, 내가 그랬잖아...우리 그런 사이 아니라고...","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":4,"start":2244.988,"end":2248.08,"text":"그냥 만나는 거야...재미 삼아","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":5,"start":2248.08,"end":2252.68,"text":"(장선호엄마) 즐기는 거면 기준을 정해야지","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":6,"start":2252.68,"end":2255.682,"text":"결혼할 생각은 아니라니까 됐고","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":7,"start":2255.682,"end":2258.671,"text":"(장선호엄마) 서로 주고받는 사이로 합의는 본 것 같은데","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":8,"start":2258.671,"end":2260.299,"text":"왜 룰을 안 지켜요?","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":9,"start":2260.299,"end":2265.538,"text":"며칠 전에 하루 동안 200만원 넘게 그었던데","speed":1,"cueUid":"merged-mtfzp9eh-24"},{"index":10,"start":2265.538,"end":2268.235975,"text":"아가씨가 그런 가치가 있다고 생각해요?","speed":1,"cueUid":"merged-mtfzp9eh-24"}],"hasShadow":true,"segments":[{"index":0,"start":2227.269029,"end":2235.393,"text":"바빠서 아이한테 잠깐 신경을 못 썼더 rceUid":"merged-mtjk4t8k-15","uid":"merged-mtjk4t8k-15","originalCueNo":112,"vi":"Trời ạ, đồ sướng quá hóa rồ.\nCuộc đời tôi sẽ phẳng lặng như thế này đến khi tôi chết sao?\nTôi sẽ ghi gì vào tự truyện đây?\nCậu phải bị thả vào giữa lòng Syria và chạy zic zac để né bom thì mới tỉnh ngộ.\nNày, trong thời kỳ khắc nghiệt này, cậu dám gọi mình là sinh viên hả?\nCậu là nhà báo sao? Gửi tôi sang Syria đi.","ko":"아주 호강에 겨워 요강에 아주 똥을 싸는구만\n내 인생...이렇게 아무 일 없이 지나가서 아무 일 없이 끝나겠지?\n이래 갖고 되겠어?\n나중에 자서전을 뭘로 메꾸냐구...\n이걸 그냥, 시리아 한복판에 떨어트려놓고\n폭탄 속을 지그재그로 뛰어다니게 해봐야 정신을 차리지, 응?\n야, 이 엄혹한 시대에 니가 그러고도 대학생이냐?\n언론인이야? 그럼 시리아로 보내주든가...","en":"Jesus. You little spoiled brat.\nUntil I die, my life will probably be simple like this.\nWhat am I going to write in my biography?\nYou'll only come to your senses if you are dropped in the middle of Syria and are forced to zigzag to avoid getting bombed.\nHey, you call yourself a college student?\nAre you a journalist? Send me to Syria then.","text":"Trời ạ, đồ sướng quá hóa rồ.\nCuộc đời tôi sẽ phẳng lặng như thế này đến khi tôi chết sao?\nTôi sẽ ghi gì vào tự truyện đây?\nCậu phải bị thả vào giữa lòng Syria và chạy zic zac để né bom thì mới tỉnh ngộ.\nNày, trong thời kỳ khắc nghiệt này, cậu dám gọi mình là sinh viên hả?\nCậu là nhà báo sao? Gửi tôi sang Syria đi.\\n아주 호강에 겨워 요강에 아주 똥을 싸는구만\n내 인생...이렇게 아무 일 없이 지나가서 아무 일 없이 끝나겠지?\n이래 갖고 되겠어?\n나중에 자서전을 뭘로 메꾸냐구...\n이걸 그냥, 시리아 한복판에 떨어트려놓고\n폭탄 속을 지그재그로 뛰어다니게 해봐야 정신을 차리지, 응?\n야, 이 엄혹한 시대에 니가 그러고도 대학생이냐?\n언론인이야? 그럼 시리아로 보내주든가...\\nJesus. You little spoiled brat.\nUntil I die, my life will probably be simple like this.\nWhat am I going to write in my biography?\nYou'll only come to your senses if you are dropped in the middle of Syria and are forced to zigzag to avoid getting bombed.\nHey, you call yourself a college student?\nAre you a journalist? Send me to Syria then.","koRange":{"start":2469.14,"end":2494.490933},"viRange":{"start":2427.039081,"end":2453.042296},"start":2427.039081,"end":2494.490933,"koSentenceMarks":[2472.818,2477.841,2480.051,2482.37,2485.319,2488.25,2491.612,2494.491],"koShadowSegments":[{"index":0,"start":2469.14,"end":2472.818,"text":"아주 호강에 겨워 요강에 아주 똥을 싸는구만","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":1,"start":2472.818,"end":2477.841,"text":"내 인생...이렇게 아무 일 없이 지나가서 아무 일 없이 끝나겠지?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":2,"start":2477.841,"end":2480.051,"text":"이래 갖고 되겠어?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":3,"start":2480.051,"end":2482.37,"text":"나중에 자서전을 뭘로 메꾸냐구...","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":4,"start":2482.37,"end":2485.319,"text":"이걸 그냥, 시리아 한복판에 떨어트려놓고","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":5,"start":2485.319,"end":2488.25,"text":"폭탄 속을 지그재그로 뛰어다니게 해봐야 정신을 차리지, 응?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":6,"start":2488.25,"end":2491.612,"text":"야, 이 엄혹한 시대에 니가 그러고도 대학생이냐?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":7,"start":2491.612,"end":2494.490933,"text":"언론인이야? 그럼 시리아로 보내주든가...","speed":1,"cueUid":"merged-mtjk4t8k-15"}],"hasShadow":true,"segments":[{"index":0,"start":2469.14,"end":2472.818,"text":"아주 호강에 겨워 요강에 아주 똥을 싸는구만","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":1,"start":2472.818,"end":2477.841,"text":"내 인생...이렇게 아무 일 없이 지나가서 아무 일 없이 끝나겠지?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":2,"start":2477.841,"end":2480.051,"text":"이래 갖고 되겠어?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":3,"start":2480.051,"end":2482.37,"text":"나중에 자서전을 뭘로 메꾸냐구...","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":4,"start":2482.37,"end":2485.319,"text":"이걸 그냥, 시리아 한복판에 떨어트려놓고","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":5,"start":2485.319,"end":2488.25,"text":"폭탄 속을 지그재그로 뛰어다니게 해봐야 정신을 차리지, 응?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":6,"start":2488.25,"end":2491.612,"text":"야, 이 엄혹한 시대에 니가 그러고도 대학생이냐?","speed":1,"cueUid":"merged-mtjk4t8k-15"},{"index":7,"start":2491.612,"end":2494.490933,"text":"언론인이야? 그럼 시리아로 보내주든가...","speed":1,"cueUid":"merged-mtjk4t8k-15"}]},{"id":112,"cueNo":113,"displayNo":113,"sourceUid":"merged-mtjkpu30-17","uid":"merged-mtjkpu30-17","originalCueNo":113,"vi":"Hẹn hò với tôi nhé? Cái gì?\nTụi mình tạo tin đồn tình ái nhé? Đi mà.\nSung Min à, năn nỉ á. Thôi đi. Cậu làm gì vậy?\nCậu định chọc điên tôi đúng không?\nChao ôi cuộc đời, sao mà nhạt nhẽo.\nCậu. Tôi làm sao? Đừng giở trò gì kỳ quái đó.","ko":"나랑 연애할래? 뭐... 뭐어\n치정멜로라도 만들어보자. 응?\n성민아! 하지 마. 뭐 하는 거야?\n(임성민) 어, 이게 날 돌연사 시키려고 이러나, 진짜...\n아휴, 인생 참...말도 못하게 한갓지구만\n너! 왜? 이상한 짓 하지마!","en":"Want to go out with me? What?\nHow about we have a scandalous little fling? Please?\nCome on, Sung-Min. Stop it. What are you doing?\nAre you trying to drive me crazy?\nMan. Life is so boring.\nYou. What? Don't do anything stupid.","text":"Hẹn hò với tôi nhé? Cái gì?\nTụi mình tạo tin đồn tình ái nhé? Đi mà.\nSung Min à, năn nỉ á. Thôi đi. Cậu làm gì vậy?\nCậu định chọc điên tôi đúng không?\nChao ôi cuộc đời, sao mà nhạt nhẽo.\nCậu. Tôi làm sao? Đừng giở trò gì kỳ quái đó.\\n나랑 연애할래? 뭐... 뭐어\n치정멜로라도 만들어보자. 응?\n성민아! 하지 마. 뭐 하는 거야?\n(임성민) 어, 이게 날 돌연사 시키려고 이러나, 진짜...\n아휴, 인생 참...말도 못하게 한갓지구만\n너! 왜? 이상한 짓 하지마!\\nWant to go out with me? What?\nHow about we have a scandalous little fling? Please?\nCome on, Sung-Min. Stop it. What are you doing?\nAre you trying to drive me crazy?\nMan. Life is so boring.\nYou. What? Don't do anything stupid.","koRange":{"start":2499.953246,"end":2526.758447},"viRange":{"start":2453.042296,"end":2483.999001},"start":2453.042296,"end":2526.758447,"koSentenceMarks":[2503.774,2507.04,2511.158,2514.339,2521.427,2526.758],"koShadowSegments":[{"index":0,"start":2499.953246,"end":2503.774,"text":"나랑 연애할래? 뭐... 뭐어","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":1,"start":2503.774,"end":2507.04,"text":"치정멜로라도 만들어보자. 응?","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":2,"start":2507.04,"end":2511.158,"text":"성민아! 하지 마. 뭐 하는 거야?","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":3,"start":2511.158,"end":2514.339,"text":"(임성민) 어, 이게 날 돌연사 시키려고 이러나, 진짜...","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":4,"start":2514.339,"end":2521.427,"text":"아휴, 인생 참...말도 못하게 한갓지구만","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":5,"start":2521.427,"end":2526.758,"text":"너! 왜? 이상한 짓 하지마!","speed":1,"cueUid":"merged-mtjkpu30-17"}],"hasShadow":true,"segments":[{"index":0,"start":2499.953246,"end":2503.774,"text":"나랑 연애할래? 뭐... 뭐어","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":1,"start":2503.774,"end":2507.04,"text":"치정멜로라도 만들어보자. 응?","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":2,"start":2507.04,"end":2511.158,"text":"성민아! 하지 마. 뭐 하는 거야?","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":3,"start":2511.158,"end":2514.339,"text":"(임성민) 어, 이게 날 돌연사 시키려고 이러나, 진짜...","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":4,"start":2514.339,"end":2521.427,"text":"아휴, 인생 참...말도 못하게 한갓지구만","speed":1,"cueUid":"merged-mtjkpu30-17"},{"index":5,"start":2521.427,"end":2526.758,"text":"너! 왜? 이상한 짓 하지마!","speed":1,"cueUid":"merged-mtjkpu30-17"}]},{"id":113,"cueNo":114,"displayNo":114,"sourceUid":"merged-mtjl44x4-18","uid":"merged-mtjl44x4-18","originalCueNo":114,"vi":"Mùa thu năm ngoái, cậu để lại di thư rồi lặn mất tăm.\nTôi nghe nói cậu làm vậy vì rảnh.\nVui mà. Vui sao? Tôi suýt gọi cấp cứu đấy.\nDám lặp lại lần nữa thì tôi xé cậu ra làm gỏi.\nĐã qua thời điểm để làm vậy rồi. Cái gì?","ko":"엥? 너 작년 가을에 유서 써 놓고 잠적했을 때도...\n심심해서 그랬다며?\n재밌었잖아 재미?\n119 출동할 뻔했는데?\n(임성민) 너 한 번만 더 그래봐. 확 그냥 진짜...\n벌써 한 거 같은데... 뭐?","en":"When you disappeared and left a suicide note last fall,\nI heard you only did it because you got bored.\nWasn't it funny? You think it's funny? I almost called 911.\nIf you do anything like that one more time, just watch.\nI think it's already too late for that. What?","text":"Mùa thu năm ngoái, cậu để lại di thư rồi lặn mất tăm.\nTôi nghe nói cậu làm vậy vì rảnh.\nVui mà. Vui sao? Tôi suýt gọi cấp cứu đấy.\nDám lặp lại lần nữa thì tôi xé cậu ra làm gỏi.\nĐã qua thời điểm để làm vậy rồi. Cái gì?\\n엥? 너 작년 가을에 유서 써 놓고 잠적했을 때도...\n심심해서 그랬다며?\n재밌었잖아 재미?\n119 출동할 뻔했는데?\n(임성민) 너 한 번만 더 그래봐. 확 그냥 진짜...\n벌써 한 거 같은데... 뭐?\\nWhen you disappeared and left a suicide note last fall,\nI heard you only did it because you got bored.\nWasn't it funny? You think it's funny? I almost called 911.\nIf you do anything like that one more time, just watch.\nI think it's already too late for that. What?","koRange":{"start":2526.758447,"end":2544.925604},"viRange":{"start":2483.999001,"end":2502.179681},"start":2483.999001,"end":2544.925604,"koSentenceMarks":[2531.112,2532.331,2536.395,2538.076,2541.597,2544.926],"koShadowSegments":[{"index":0,"start":2526.758447,"end":2531.112,"text":"엥? 너 작년 가을에 유서 써 놓고 잠적했을 때도...","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":1,"start":2531.112,"end":2532.331,"text":"심심해서 그랬다며?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":2,"start":2532.331,"end":2536.395,"text":"재밌었잖아 재미?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":3,"start":2536.395,"end":2538.076,"text":"119 출동할 뻔했는데?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":4,"start":2538.076,"end":2541.597,"text":"(임성민) 너 한 번만 더 그래봐. 확 그냥 진짜...","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":5,"start":2541.597,"end":2544.925604,"text":"벌써 한 거 같은데... 뭐?","speed":1,"cueUid":"merged-mtjl44x4-18"}],"hasShadow":true,"segments":[{"index":0,"start":2526.758447,"end":2531.112,"text":"엥? 너 작년 가을에 유서 써 놓고 잠적했을 때도...","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":1,"start":2531.112,"end":2532.331,"text":"심심해서 그랬다며?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":2,"start":2532.331,"end":2536.395,"text":"재밌었잖아 재미?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":3,"start":2536.395,"end":2538.076,"text":"119 출동할 뻔했는데?","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":4,"start":2538.076,"end":2541.597,"text":"(임성민) 너 한 번만 더 그래봐. 확 그냥 진짜...","speed":1,"cueUid":"merged-mtjl44x4-18"},{"index":5,"start":2541.597,"end":2544.925604,"text":"벌써 한 거 같은데... 뭐?","speed":1,"cueUid":"merged-mtjl44x4-18"}]},{"id":114,"cueNo":115,"displayNo":115,"sourceUid":"merged-mtjlbdsk-19","uid":"merged-mtjlbdsk-19","originalCueNo":115,"vi":"Anh muốn hỏi em chuyện này.\nVâng. Đây là việc quan trọng nên hãy nghĩ kỹ trước khi trả lời.\nAnh muốn hỏi gì? Em sẵn sàng chưa?\nThần giao cách cảm. Đọc suy nghĩ. Xuyên không.\nNói chung là em có thể sở hữu một siêu năng lực.\nEm sẽ chọn cái nào? Dạ? Anh chọn thần giao cách cảm.","ko":"물어볼 말이 있어. 예... 중요한 거니까...\n잘 생각하고 신중하게 대답해. 뭔데요? \n준비됐어? 텔레파시. 독심술. 공간이동\n아무튼...온갖 초능력 중에 하나를 가질 수 있어. \n넌 뭐 할래? 예? 난 텔레파시","en":"I have something to ask.\nYes? It's important, so think carefully before you answer.\nWhat is it? Are you ready?\nTelepathy. Mind reading. ESP.\nYou can have one of these superpowers.\nWhich one would you choose? What? I would choose telepathy.","text":"Anh muốn hỏi em chuyện này.\nVâng. Đây là việc quan trọng nên hãy nghĩ kỹ trước khi trả lời.\nAnh muốn hỏi gì? Em sẵn sàng chưa?\nThần giao cách cảm. Đọc suy nghĩ. Xuyên không.\nNói chung là em có thể sở hữu một siêu năng lực.\nEm sẽ chọn cái nào? Dạ? Anh chọn thần giao cách cảm.\\n물어볼 말이 있어. 예... 중요한 거니까...\n잘 생각하고 신중하게 대답해. 뭔데요? \n준비됐어? 텔레파시. 독심술. 공간이동\n아무튼...온갖 초능력 중에 하나를 가질 수 있어. \n넌 뭐 할래? 예? 난 텔레파시\\nI have something to ask.\nYes? It's important, so think carefully before you answer.\nWhat is it? Are you ready?\nTelepathy. Mind reading. ESP.\nYou can have one of these superpowers.\nWhich one would you choose? What? I would choose telepathy.","koRange":{"start":2559.441881,"end":2595.094},"viRange":{"start":2513.637162,"end":2552.025371},"start":2513.637162,"end":2595.094,"koSentenceMarks":[2565.065,2569.892,2586.093,2590.813,2595.094],"koShadowSegments":[{"index":0,"start":2559.442,"end":2565.065,"text":"물어볼 말이 있어. 예... 중요한 거니까...","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":1,"start":2565.065,"end":2569.892,"text":"잘 생각하고 신중하게 대답해. 뭔데요?","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":2,"start":2569.892,"end":2586.093,"text":"준비됐어? 텔레파시. 독심술. 공간이동","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":3,"start":2586.093,"end":2590.813,"text":"아무튼...온갖 초능력 중에 하나를 가질 수 있어.","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":4,"start":2590.813,"end":2595.094,"text":"넌 뭐 할래? 예? 난 텔레파시","speed":1,"cueUid":"merged-mtjlbdsk-19"}],"hasShadow":true,"segments":[{"index":0,"start":2559.442,"end":2565.065,"text":"물어볼 말이 있어. 예... 중요한 거니까...","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":1,"start":2565.065,"end":2569.892,"text":"잘 생각하고 신중하게 대답해. 뭔데요?","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":2,"start":2569.892,"end":2586.093,"text":"준비됐어? 텔레파시. 독심술. 공간이동","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":3,"start":2586.093,"end":2590.813,"text":"아무튼...온갖 초능력 중에 하나를 가질 수 있어.","speed":1,"cueUid":"merged-mtjlbdsk-19"},{"index":4,"start":2590.813,"end":2595.094,"text":"넌 뭐 할래? 예? 난 텔레파시","speed":1,"cueUid":"merged-mtjlbdsk-19"}]},{"id":115,"cueNo":116,"displayNo":116,"sourceUid":"merged-mtjlnpkr-21","uid":"merged-mtjlnpkr-21","originalCueNo":116,"vi":"Tàng hình thì cũng được, nhưng anh chắc chắn muốn thần giao cách cảm.\nKhi chúng ta nắm tay nhau, sẽ biết cảm xúc của đối phương. Ngầu nhỉ? \nBọn mình sẽ không bao giờ hiểu lầm nhau.\nVà cũng không cần học thêm ngoại ngữ.\nGiá mà có người tạo ra chiếc máy đó.\nAnh không có siêu năng lực và không ai có thể tạo ra chiếc máy như vậy.\nNên anh đoán mình chỉ cần trò chuyện là được.\nDạo này em đang gặp rắc rối gì đó.","ko":"음... 투명인간이랑 약간 헷갈리긴 하지만...역시 텔레파시야\n(윤종열) 이렇게 손을 잡으면...\n마음이 통하는 거지. 좋겠지?\n서로 오해할 일도 없고\n아, 외국어 따로 안 배워도 되고\n그런 기계 누가 안 만드나?\n그런 초능력은 없고...\n아직 그런 기계도 없고...그러니 어쩌겠냐?\n부족하더라도 말로 하는 수 밖에...\n너 요새 무슨 일 있지?","en":"I could go with invisibility, but I would definitely go for telepathy.\nWhen we hold our hands together,\nwe will know how we feel.\nWouldn't that be cool? We'd never misunderstand each other.\nAnd you wouldn't have to learn other languages.\nCan't someone invent a machine like that?\nI don't have that kind of superpower, and nobody has invented a machine like that.\nSo I guess we just need to talk to each other.\nSomething's been going on with you lately.","text":"Tàng hình thì cũng được, nhưng anh chắc chắn muốn thần giao cách cảm.\nKhi chúng ta nắm tay nhau, sẽ biết cảm xúc của đối phương. Ngầu nhỉ? \nBọn mình sẽ không bao giờ hiểu lầm nhau.\nVà cũng không cần học thêm ngoại ngữ.\nGiá mà có người tạo ra chiếc máy đó.\nAnh không có siêu năng lực và không ai có thể tạo ra chiếc máy như vậy.\nNên anh đoán mình chỉ cần trò chuyện là được.\nDạo này em đang gặp rắc rối gì đó.\\n음... 투명인간이랑 약간 헷갈리긴 하지만...역시 텔레파시야\n(윤종열) 이렇게 손을 잡으면...\n마음이 통하는 거지. 좋겠지?\n서로 오해할 일도 없고\n아, 외국어 따로 안 배워도 되고\n그런 기계 누가 안 만드나?\n그런 초능력은 없고...\n아직 그런 기계도 없고...그러니 어쩌겠냐?\n부족하더라도 말로 하는 수 밖에...\n너 요새 무슨 일 있지?\\nI could go with invisibility, but I would definitely go for telepathy.\nWhen we hold our hands together,\nwe will know how we feel.\nWouldn't that be cool? We'd never misunderstand each other.\nAnd you wouldn't have to learn other languages.\nCan't someone invent a machine like that?\nI don't have that kind of superpower, and nobody has invented a machine like that.\nSo I guess we just need to talk to each other.\nSomething's been going on with you lately.","koRange":{"start":2606.735701,"end":2641.245},"viRange":{"start":2552.025371,"end":2597.608439},"start":2552.025371,"end":2641.245,"koSentenceMarks":[2601.024,2609.014,2616.478,2620.774,2624.341,2634.211,2636.378,2641.245],"koShadowSegments":[{"index":0,"start":2606.736,"end":2609.014,"text":"(윤종열) 이렇게 손을 잡으면...","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":1,"start":2616.478,"end":2620.774,"text":"서로 오해할 일도 없고 아, 외국어 따로 안 배워도 되고","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":2,"start":2620.774,"end":2624.341,"text":"그런 기계 누가 안 만드나?","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":3,"start":2628,"end":2634.211,"text":"그런 초능력은 없고...아직 그런 기계도 없고...그러니 어쩌겠냐?","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":4,"start":2634.211,"end":2636.378,"text":"부족하더라도 말로 하는 수 밖에...","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":5,"start":2638,"end":2641.245,"text":"너 요새 무슨 일 있지?","speed":1,"cueUid":"merged-mtjlnpkr-21"}],"hasShadow":true,"segments":[{"index":0,"start":2606.736,"end":2609.014,"text":"(윤종열) 이렇게 손을 잡으면...","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":1,"start":2616.478,"end":2620.774,"text":"서로 오해할 일도 없고 아, 외국어 따로 안 배워도 되고","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":2,"start":2620.774,"end":2624.341,"text":"그런 기계 누가 안 만드나?","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":3,"start":2628,"end":2634.211,"text":"그런 초능력은 없고...아직 그런 기계도 없고...그러니 어쩌겠냐?","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":4,"start":2634.211,"end":2636.378,"text":"부족하더라도 말로 하는 수 밖에...","speed":1,"cueUid":"merged-mtjlnpkr-21"},{"index":5,"start":2638,"end":2641.245,"text":"너 요새 무슨 일 있지?","speed":1,"cueUid":"merged-mtjlnpkr-21"}]},{"id":116,"cueNo":117,"displayNo":117,"sourceUid":"merged-mtjm0zas-22","uid":"merged-mtjm0zas-22","originalCueNo":117,"vi":"Kể anh nghe đi. \nAnh say mê em quá rồi nên anh tin mình sẽ chấp nhận mọi điều em nói thôi.\nVậy nên đây là cơ hội tốt.\nQua thời kỳ này thì anh không dám hứa đâu.\nLẽ nào em là gián điệp?\nNgười ngoài hành tinh?\nKhông phải những thứ đó thì không sao.\nHãy thoải mái kể cho anh nghe.\nEm nói đi. Không có chuyện gì đâu. Thật không? Thật.","ko":"말해봐..난 지금 너한테 푹 빠진 상태라... \n니가 무슨 말을 해도 다 이해할 자신 있어...\n그러니까 지금이 기회야\n요 시기 지나면... 장담 못한다, 너\n너 혹시 간첩이야?\n외계인이야? 그런 건 아닐 거잖아\n그럼 됐어\n맘 편하게 말해봐. 그런 거 없어요. 진짜? 네","en":"Tell me.\nI'm totally head over heels in love with you right now, so I'm confident that I'll be totally accepting of anything that you say.\nSo this is your chance.\nI can't guarantee anything after the honeymoon is over.\nAre you a spy?\nAre you an alien?\nIf it isn't anything like that, it's fine.\nDon't worry, just tell me. Go ahead.\nThere's nothing going on. Really? Yes.","text":"Kể anh nghe đi. \nAnh say mê em quá rồi nên anh tin mình sẽ chấp nhận mọi điều em nói thôi.\nVậy nên đây là cơ hội tốt.\nQua thời kỳ này thì anh không dám hứa đâu.\nLẽ nào em là gián điệp?\nNgười ngoài hành tinh?\nKhông phải những thứ đó thì không sao.\nHãy thoải mái kể cho anh nghe.\nEm nói đi. Không có chuyện gì đâu. Thật không? Thật.\\n말해봐..난 지금 너한테 푹 빠진 상태라... \n니가 무슨 말을 해도 다 이해할 자신 있어...\n그러니까 지금이 기회야\n요 시기 지나면... 장담 못한다, 너\n너 혹시 간첩이야?\n외계인이야? 그런 건 아닐 거잖아\n그럼 됐어\n맘 편하게 말해봐. 그런 거 없어요. 진짜? 네\\nTell me.\nI'm totally head over heels in love with you right now, so I'm confident that I'll be totally accepting of anything that you say.\nSo this is your chance.\nI can't guarantee anything after the honeymoon is over.\nAre you a spy?\nAre you an alien?\nIf it isn't anything like that, it's fine.\nDon't worry, just tell me. Go ahead.\nThere's nothing going on. Really? Yes.","koRange":{"start":2644.538905,"end":2691.138451},"viRange":{"start":2597.608439,"end":2653.220683},"start":2597.608439,"end":2691.138451,"koSentenceMarks":[2653.801,2656.889,2658.691,2661.533,2664.552,2674.089,2675.479,2691.138],"koShadowSegments":[{"index":0,"start":2644.539,"end":2653.801,"text":"말해봐..난 지금 너한테 푹 빠진 상태라...","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":1,"start":2653.801,"end":2656.889,"text":"니가 무슨 말을 해도 다 이해할 자신 있어...","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":2,"start":2656.889,"end":2658.691,"text":"그러니까 지금이 기회야","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":3,"start":2658.691,"end":2661.533,"text":"요 시기 지나면... 장담 못한다, 너","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":4,"start":2661.533,"end":2664.552,"text":"너 혹시 간첩이야?","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":5,"start":2664.552,"end":2674.089,"text":"외계인이야? 그런 건 아닐 거잖아","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":6,"start":2674.089,"end":2675.479,"text":"그럼 됐어","speed":1,"cueUid":"merged-mtjm0zas-22"},{"index":7,"start":2675.479,"end":2691.138,"text":"맘 편하게 말해봐. 그런 거 없어요. 진짜? 네","speed":1,"cueUid":"merged-mtjm0zas-22"}],"hasShadow":true,"segments":[{"index":0,"start":2644.539,"end":2653.801,"text":"말해봐..난 지금 ShadowSegments":[],"hasShadow":false,"segments":[]},{"id":119,"cueNo":120,"displayNo":120,"sourceUid":"merged-mtjnmsy5-27","uid":"merged-mtjnmsy5-27","originalCueNo":120,"vi":"[Tiếng nước đổ]\n[Âm nhạc cổ điển bắt đầu]\n[Nhạc cổ điển kết thúc]","ko":"[물 붓는 소리]\n[클래식 음악 시작]\n[클래식 음악 끝]","en":"[Sound of pouring water]\n[Classical music starts]\n[Classical music ends]","text":"[Tiếng nước đổ]\n[Âm nhạc cổ điển bắt đầu]\n[Nhạc cổ điển kết thúc]\\n[물 붓는 소리]\n[클래식 음악 시작]\n[클래식 음악 끝]\\n[Sound of pouring water]\n[Classical music starts]\n[Classical music ends]","koRange":null,"viRange":null,"start":2840.33,"end":2841.63,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":120,"cueNo":121,"displayNo":121,"sourceUid":"merged-mtl76s6q-1","uid":"merged-mtl76s6q-1","originalCueNo":121,"vi":"Chào mừng quý khách.\nChào mọi người. Chào mừng quý khách.","ko":"안녕하세요. 어서 오십시오","en":"Hello. Welcome.","text":"Chào mừng quý khách.\nChào mọi người. Chào mừng quý khách.\\n안녕하세요. 어서 오십시오\\nHello. Welcome.","koRange":null,"viRange":{"start":2728.225052,"end":2730.836029},"start":2728.225052,"end":2730.836029,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":121,"cueNo":122,"displayNo":122,"sourceUid":"merged-mtjntq5p-28","uid":"merged-mtjntq5p-28","originalCueNo":122,"vi":"Tôi tự hỏi \"Tại sao họ sống chăm chỉ đến vậy?\"\nCuộc đời mong manh hơn cả món đồ chơi rẻ tiền mà.\nTôi tò mò tại sao mọi người trân trọng cuộc sống đến vậy.\nĐạp tiếp. Bố đừng thả tay.\nĐừng sợ. Bố đừng bỏ ra.\nĐừng lo. Đi thẳng đi. Bố đừng thả ra.\nTiếp tục đạp đi nào. Con đạp tiếp đi. Giỏi quá.\nTôi tự hỏi \"Tại sao mọi người mãi hướng về phía trước?\"\nKhông ai biết thứ gì đang chờ họ.","ko":"(강이나) 왜들 그렇게 열심일까라고 생각했다\n삶은 싸구려 장난감보다도 더 쉽게 부서지는데...\n어떻게 그렇게 소중하게 여기는 걸까 궁금했다\n(아이 아빠) 페달을 계속 밟고\n(아이 아빠) 어, 안 놨어, 안 놨어, 안 놨어...\n(자전거 타는 아이) 절대 놓지 마\n페달 밟아야지. 페달 계속 밟아\n(아이 아빠) 앞으로 쭉...오케이, 오케이, 잘한다! 잘했어, 잘했어\n(강이나) 왜들 그렇게 앞으로 가려는 걸까라고 생각했다","en":"I thought to myself, \"Why are they all trying so hard?\"\nLife is more fragile than a cheap toy.\nI was wondering why everyone thinks life is so precious?\nKeep pedaling. Don't let go.\nDon't worry, I haven't! Don't let go!\nDon't worry. Keep going forward. Don't let go.\nKeep pedaling. Keep going forward. Good job.\nI thought, \"Why is everyone trying so hard to move forward?\"\nNo one knows what awaits them.","text":"Tôi tự hỏi \"Tại sao họ sống chăm chỉ đến vậy?\"\nCuộc đời mong manh hơn cả món đồ chơi rẻ tiền mà.\nTôi tò mò tại sao mọi người trân trọng cuộc sống đến vậy.\nĐạp tiếp. Bố đừng thả tay.\nĐừng sợ. Bố đừng bỏ ra.\nĐừng lo. Đi thẳng đi. Bố đừng thả ra.\nTiếp tục đạp đi nào. Con đạp tiếp đi. Giỏi quá.\nTôi tự hỏi \"Tại sao mọi người mãi hướng về phía trước?\"\nKhông ai biết thứ gì đang chờ họ.\\n(강이나) 왜들 그렇게 열심일까라고 생각했다\n삶은 싸구려 장난감보다도 더 쉽게 부서지는데...\n어떻게 그렇게 소중하게 여기는 걸까 궁금했다\n(아이 아빠) 페달을 계속 밟고\n(아이 아빠) 어, 안 놨어, 안 놨어, 안 놨어...\n(자전거 타는 아이) 절대 놓지 마\n페달 밟아야지. 페달 계속 밟아\n(아이 아빠) 앞으로 쭉...오케이, 오케이, 잘한다! 잘했어, 잘했어\n(강이나) 왜들 그렇게 앞으로 가려는 걸까라고 생각했다\\nI thought to myself, \"Why are they all trying so hard?\"\nLife is more fragile than a cheap toy.\nI was wondering why everyone thinks life is so precious?\nKeep pedaling. Don't let go.\nDon't worry, I haven't! Don't let go!\nDon't worry. Keep going forward. Don't let go.\nKeep pedaling. Keep going forward. Good job.\nI thought, \"Why is everyone trying so hard to move forward?\"\nNo one knows what awaits them.","koRange":{"start":2839.06858,"end":2865.31},"viRange":{"start":2794.363322,"end":2825.535861},"start":2794.363322,"end":2865.31,"koSentenceMarks":[2842.801,2847.152,2851.317,2865.31],"koShadowSegments":[{"index":0,"start":2839.069,"end":2842.801,"text":"(강이나) 왜들 그렇게 열심일까라고 생각했다","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":1,"start":2842.801,"end":2847.152,"text":"삶은 싸구려 장난감보다도 더 쉽게 부서지는데...","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":2,"start":2847.152,"end":2851.317,"text":"어떻게 그렇게 소중하게 여기는 걸까 궁금했다","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":3,"start":2862,"end":2865.31,"text":"(강이나) 왜들 그렇게 앞으로 가려는 걸까라고 생각했다","speed":1,"cueUid":"merged-mtjntq5p-28"}],"hasShadow":true,"segments":[{"index":0,"start":2839.069,"end":2842.801,"text":"(강이나) 왜들 그렇게 열심일까라고 생각했다","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":1,"start":2842.801,"end":2847.152,"text":"삶은 싸구려 장난감보다도 더 쉽게 부서지는데...","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":2,"start":2847.152,"end":2851.317,"text":"어떻게 그렇게 소중하게 여기는 걸까 궁금했다","speed":1,"cueUid":"merged-mtjntq5p-28"},{"index":3,"start":2862,"end":2865.31,"text":"(강이나) 왜들 그렇게 앞으로 가려는 걸까라고 생각했다","speed":1,"cueUid":"merged-mtjntq5p-28"}]},{"id":122,"cueNo":123,"displayNo":123,"sourceUid":"merged-mtjooavi-29","uid":"merged-mtjooavi-29","originalCueNo":123,"vi":"Tôi nghĩ những người đặt mục tiêu và cố gắng đạt được nó thật kỳ lạ.\nCon đạp tiếp đi. Cứ đi thẳng. Con làm tốt lắm.\nGiỏi lắm. Con sao rồi? Bố xin lỗi.\nBố buông tay đúng không? Tại bố hết. Tại bố thả tay ra.\nKhông phải, do con không chịu đạp đấy.\nNếu con dừng đạp thì xe sẽ đổ.\nLần này bố sẽ không thả ra. Đi nào.","ko":"거기에 뭐가 있는지도 모르면서...\n저 앞 어딘가에 점을 찍고 그곳으로 가려는 사람들이 이상했다\n페달 계속 밟아\n앞으로 쭉... 오케이, 오케이, 잘한다!\n옳지! 잘했어, 잘했어\n(아이 아빠) 어, 잘하네... (아이) 어!\n(자전거 타는 아이) 아야!\n괜찮니? 아휴, 어떡해... 미안해...\n손 놨지? 아빠 때문이야 아빠가 놔서 그래!\n(아이 아빠) 거봐, 페달을 안 밟아서 그래...\n(아이 아빠) 자전거는 멈추면 쓰러져\n(아이 아빠) 이야, 이제 아빠 안 놓을게\n(아이 아빠) 가자!\n(아이 아빠) 가자! 아빠 안 놓을게","en":"I think those who set a target and try to achieve it are weird.\nKeep going. Keep it straight. You are doing great. Great job.\nAre you okay? I'm sorry.\nYou let go, didn't you? It's all your fault.\nIt's because you let go.\nNo, it's because you didn't pedal hard enough.\nBicycles fall over if you stop pedaling.\nDaddy won't let go this time. Let's go.","text":"Tôi nghĩ những người đặt mục tiêu và cố gắng đạt được nó thật kỳ lạ.\nCon đạp tiếp đi. Cứ đi thẳng. Con làm tốt lắm.\nGiỏi lắm. Con sao rồi? Bố xin lỗi.\nBố buông tay đúng không? Tại bố hết. Tại bố thả tay ra.\nKhông phải, do con không chịu đạp đấy.\nNếu con dừng đạp thì xe sẽ đổ.\nLần này bố sẽ không thả ra. Đi nào.\\n거기에 뭐가 있는지도 모르면서...\n저 앞 어딘가에 점을 찍고 그곳으로 가려는 사람들이 이상했다\n페달 계속 밟아\n앞으로 쭉... 오케이, 오케이, 잘한다!\n옳지! 잘했어, 잘했어\n(아이 아빠) 어, 잘하네... (아이) 어!\n(자전거 타는 아이) 아야!\n괜찮니? 아휴, 어떡해... 미안해...\n손 놨지? 아빠 때문이야 아빠가 놔서 그래!\n(아이 아빠) 거봐, 페달을 안 밟아서 그래...\n(아이 아빠) 자전거는 멈추면 쓰러져\n(아이 아빠) 이야, 이제 아빠 안 놓을게\n(아이 아빠) 가자!\n(아이 아빠) 가자! 아빠 안 놓을게\\nI think those who set a target and try to achieve it are weird.\nKeep going. Keep it straight. You are doing great. Great job.\nAre you okay? I'm sorry.\nYou let go, didn't you? It's all your fault.\nIt's because you let go.\nNo, it's because you didn't pedal hard enough.\nBicycles fall over if you stop pedaling.\nDaddy won't let go this time. Let's go.","koRange":{"start":2865.31,"end":2903.222},"viRange":{"start":2825.535861,"end":2860.089696},"start":2825.535861,"end":2903.222,"koSentenceMarks":[2868.198,2873.449,2874.918,2876.943,2883.59,2889.299,2892.831,2894.64,2903.222],"koShadowSegments":[{"index":0,"start":2865.31,"end":2868.198,"text":"거기에 뭐가 있는지도 모르면서...","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":1,"start":2868.198,"end":2873.449,"text":"저 앞 어딘가에 점을 찍고 그곳으로 가려는 사람들이 이상했다","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":2,"start":2873.449,"end":2874.918,"text":"페달 계속 밟아","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":3,"start":2874.918,"end":2876.943,"text":"앞으로 쭉... 오케이, 오케이, 잘한다!","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":4,"start":2876.943,"end":2883.59,"text":"옳지! 잘했어, 잘했어. (아이 아빠) 어, 잘하네... (아이) 어! (자전거 타는 아이) 아야!","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":5,"start":2883.59,"end":2889.299,"text":"괜찮니? 아휴, 어떡해...미안해...손 놨지? 아빠 때문이야. 아빠가 놔서 그래!","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":6,"start":2889.299,"end":2892.831,"text":"(아이 아빠) 거봐, 페달을 안 밟아서 그래...","speed":1,"cueUid":"merged-mtjooavi-29"},{"index":7,"start":2892.831,"end":2894.64,"text":"(아이 아빠) 자전거는 멈추면 쓰러져","speed":1,"cueUid":"merged-mtjooavi-29"},{"i 같이 하자고 해서...\n아저씨! 그때 말이에요...\n그날 그때... 나 대신 아저씨 딸이 살았더라면... 아저씨 뭐라고 할래요?\n아저씨 딸한테... 죄송해요. 살라고\n죄책감 같은 거 갖지 말고\n살아난 건... 부끄러운 게 아니니까\n살라고... 잘 살라고 그렇게 살아가라고","en":"Here. Keep it then. Why? I thought you hated me.\nWhy would I hate you? Things happened to turn out this way. You said it's a lucky charm.\nTake care of yourself. Are you going somewhere?\nSomeone I know asked me to work with him, so...\nMister! On that day, at that time... If your daughter had survived instead of me...\nwhat would you have said? To your daughter, I mean.\nI am sorry. To live. Not to feel guilty. There is nothing to be\nashamed about in surviving.\nSo, I'd tell her to live. To live a good life. Continue to live a good life.","text":"Đây. Bùa may mắn của cô mà. Vậy thì hãy đeo nó.\nTại sao? Tôi tưởng chú hận tôi. Sao tôi phải hận cô?\nSố phận an bài chuyện đó phải xảy ra mà. Bảo trọng nhé. Chú sắp đi đâu à?\nNgười quen của tôi rủ đi làm ăn, nên…\nChú này! Hôm đó, giờ đó… nếu con gái chú còn sống… chú sẽ nói gì?\nVới con gái chú đấy. Tôi xin lỗi. Hãy sống nhé. Đừng tự trách mình.\nCòn sống không phải điều đáng xấu hổ. Tôi sẽ bảo con bé sống.\nHãy sống tử tế. Tiếp tục cuộc đời này.\\n(오종규) 이거...부적으로 써. 왜요?\n아저씨 나 미워하잖아요\n니가 뭐가 밉냐? 그냥 일이 그렇게 된 거지... 부적이라며? 잘 지내\n어디 가요? 건너 건너 아는 사람이...\n일을 같이 하자고 해서...\n아저씨! 그때 말이에요...\n그날 그때... 나 대신 아저씨 딸이 살았더라면... 아저씨 뭐라고 할래요?\n아저씨 딸한테... 죄송해요. 살라고\n죄책감 같은 거 갖지 말고\n살아난 건... 부끄러운 게 아니니까\n살라고... 잘 살라고 그렇게 살아가라고\\nHere. Keep it then. Why? I thought you hated me.\nWhy would I hate you? Things happened to turn out this way. You said it's a lucky charm.\nTake care of yourself. Are you going somewhere?\nSomeone I know asked me to work with him, so...\nMister! On that day, at that time... If your daughter had survived instead of me...\nwhat would you have said? To your daughter, I mean.\nI am sorry. To live. Not to feel guilty. There is nothing to be\nashamed about in surviving.\nSo, I'd tell her to live. To live a good life. Continue to live a good life.","koRange  사람이...","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":4,"start":2970.921,"end":2972.878,"text":"일을 같이 하자고 해서...","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":5,"start":2972.878,"end":2988.82,"text":"아저씨! 그때 말이에요...","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":6,"start":2988.82,"end":2998.041,"text":"그날 그때... 나 대신 아저씨 딸이 살았더라면... 아저씨 뭐라고 할래요?","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":7,"start":2998.041,"end":3016.734,"text":"아저씨 딸한테... 죄송해요. 살라고","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":8,"start":3016.734,"end":3021.494,"text":"죄책감 같은 거 갖지 말고","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":9,"start":3021.494,"end":3026.176,"text":"살아난 건... 부끄러운 게 아니니까","speed":1,"cueUid":"merged-mtjp1w8l-31"},{"index":10,"start":3026.176,"end":3035.069,"text":"살라고... 잘 살라고 그렇게 살아가라고","speed":1,"cueUid":"merged-mtjp1w8l-31"}]},{"id":124,"cueNo":125,"displayNo":125,"sourceUid":"merged-mtjpbhda-33","uid":"merged-mtjpbhda-33","originalCueNo":125,"vi":"[Nhạc nền bắt đầu]\n[Tak][Nhạc nền kết thúc]","ko":"[배경 음악 시작]\n[탁][배경 음악 끝]","en":"[Background music starts]\n[Tak][Background music ends]","text":"[Nhạc nền bắt đầu]\n[Tak][Nhạc nền kết thúc]\\n[배경 음악 시작]\n[탁][배경 음악 끝]\\n[Background music starts]\n[Tak][Background music ends]","koRange":null,"viRange":null,"start":3112.4,"end":3113.3,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":125,"cueNo":126,"displayNo":126,"sourceUid":"merged-mtjpdbps-34","uid":"merged-mtjpdbps-34","originalCueNo":126,"vi":"Tôi sẽ làm. Để tôi làm. Hôm nay ai đã vào kho rượu?\nChúng ta bị mất hai chai rượu. Túi xách của cô đâu?\nTôi mang đến ngay. Không được. Cô coi tôi là đồ ngốc sao?\nAnh Jae Wan. Anh ra đây mau. Chúng ta bị mất rượu. Mở ra đi.","ko":"어, 그거 내가 할게요. 내가...\n오늘 와인 창고 들어간 사람 누구야?\n와인 두 병이 없어졌어 가방 어딨나? 가져오겠습니다\n(매니저) 그건 안 되지, 그건... 누굴 바보로 아나 이게...\n재완 씨. 빨리 와봐, 와인 없어졌대. 열어봐","en":"I'll do that. I'll do it. Who's the person who went to the wine cellar today? We are missing two bottles.\nWhere's your bag? I'll bring it here. No, that won't do.Do you think I am a fool?\nMr. Jae-Hwan! Come quick. Some wine has gone missing. Open it.","text":"Tôi sẽ làm. Để tôi làm. Hôm nay ai đã vào kho rượu?\nChúng ta bị mất hai chai rượu. Túi xách của cô đâu?\nTôi mang đến ngay. Không được. Cô coi tôi là đồ ngốc sao?\nAnh Jae Wan. Anh ra đây mau. Chúng ta bị mất rượu. Mở ra đi.\\n어, 그거 내가 할게요. 내가...\n오늘 와인 창고 들어간 사람 누구야?\n와인 두 병이 없어졌어 가방 어딨나? 가져오겠습니다\n(매니저) 그건 안 되지, 그건... 누굴 바보로 아나 이게...\n재완 씨. 빨리 와봐, 와인 없어졌대. 열어봐\\nI'll do that. I'll do it. Who's the person who went to the wine cellar today? We are missing two bottles.\nWhere's your bag? I'll bring it here. No, that won't do.Do you think I am a fool?\nMr. Jae-Hwan! Come quick. Some wine has gone missing. Open it.","koRange":{"start":3089.556454,"end":3143.332517},"viRange":{"start":3046.406743,"end":3099.520687},"start":3046.406743,"end":3143.332517,"koSentenceMarks":[3092.978,3103.329,3115.028,3127.189,3143.333],"koShadowSegments":[{"index":0,"start":3089.556454,"end":3092.978,"text":"어, 그거 내가 할게요. 내가...","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":1,"start":3100,"end":3103.329,"text":"오늘 와인 창고 들어간 사람 누구야?","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":2,"start":3103.329,"end":3115.028,"text":"와인 두 병이 없어졌어 가방 어딨나? 가져오겠습니다","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":3,"start":3115.028,"end":3127.189,"text":"(매니저) 그건 안 되지, 그건... 누굴 바보로 아나 이게...","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":4,"start":3132.669,"end":3143.332517,"text":"재완 씨. 빨리 와봐, 와인 없어졌대. 열어봐","speed":1,"cueUid":"merged-mtjpdbps-34"}],"hasShadow":true,"segments":[{"index":0,"start":3089.556454,"end":3092.978,"text":"어, 그거 내가 할게요. 내가...","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":1,"start":3100,"end":3103.329,"text":"오늘 와인 창고 들어간 사람 누구야?","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":2,"start":3103.329,"end":3115.028,"text":"와인 두 병이 없어졌어 가방 어딨나? 가져오겠습니다","speed":1,"cueUid":"merged-mtjpdbps-34"},{"index":3,"start":3 ng! Apologize to me!\nStop it. Apologize to me right now! Stop it. You.","text":"Cô giấu chúng ở đâu? Cô giấu ở đâu rồi?\nAnh đang làm gì vậy? Chết tiệt. Anh xin lỗi đi. Cái gì?\nHãy xin lỗi tôi và… bỏ lại đồ vào túi trả tôi. Cô điên à? Này, cô là nghi phạm đấy.\nCô còn dám đòi tôi xin lỗi ư? Xin lỗi tôi ngay! Và cất đồ vào túi trả tôi!\nCô mất trí rồi à? Này. Xin lỗi. Xin lỗi tôi ngay! Tôi làm sai gì hả?\nTôi phải làm sao anh mới vừa lòng? Xin lỗi tôi đi! Xin lỗi tôi ngay bây giờ! Đồ khốn!\nJin Myung à! Xin lỗi tôi ngay! Thôi nào. Xin lỗi tôi ngay!\nThôi mà Jin Myung. Tên kia!\\n(매니저) 어디다 숨겼어? 어디다 숨겼어? 어디다 숨겼어!\n지금 뭐 하시는 겁니까? (매니저) 재수 없게, 씨이. 사과해요\n뭐? 나한테 사과하고... 이거 주워 담아요\n미쳤나! 야! 야! 너 지금 용의자야, 어? 니 주제에 사과를 받어!\n나한테 사과하고! 이거 주어 담으라구!\n이게 미쳤나, 지금...사과해! 사과해!\n내가 뭘 그렇게 잘못했는데? 내가 어떡해야 되는데? 사과해! 나한테 사과하란 말이야!\n진명씨! 나한테 사과해! (박재완) 진명 씨...\n(윤진명) 빨리 나한테 사과하라고! (박재완) 진명 씨 (윤진명) 으아악!\\nWhere did you hide them? What are you doing? Damn it.\nApologize. What? Apologize to me and... put my stuff back in my bag.\nAre you out of your mind? Hey. You're a suspect.\nHow dare you ask for a freaking apology? Apologize to me!\nAnd put my stuff back in my bag! Are you out of your mind? Hey. Apologize. Apologize!\nWhat the hell did I do wrong?\nHow much more are you going to make me suffer?\nApologize to me! Apologize right now, damn it! Jin-Myung! Apologize to me!\nStop it. Apologize to me right now! Stop it. You.","koRange":{"start":3165.361767,"end":3236.814015},"viRange":{"start":3134.589984,"end":3216.321322},"start":3134.589984,"end":3236.814015,"koSentenceMarks":[3168.81,3184.611,3194.166,3204.906,3208.737,3215.079,3222.186,3234.676],"koShadowSegments":[{"index":0,"start":3165.467,"end":3168.81,"text":"(매니저) 어디다 숨겼어? 어디다 숨겼어? 어디다 숨겼어!","speed":1,"cueUid":"merged-mtjprdxa-35"},{"index":1,"start":3168.81,"end":3184.611,"text":"지금 뭐 하시는 겁니까? (매니저) 재수 없게, 씨이. 사과해요","speed":1,"cueUid":"merged-mtjprdxa-35"},{"index":2,"start":3184.611,"end":3194.166,"text":"뭐? 나한테 사과하고... 이거 주워 담아요"," 서... 그래","en":"What? What is it? What? What time is it? Yoon is acting strange.\nI always wanted to do things like dating, drinking coffee, talking, visiting restaurants, and so on.\nJust like everyone else.\nHey. Long time no see.\nYou didn't have lunch yet?\nSee ya. So chubby! You're not going to class?\nNo. Something came up. Okay.","text":"Sao? Chuyện gì? Vụ gì đấy? Mấy giờ rồi? Tiền bối Yoon lạ lắm.\nEm chỉ muốn gặp anh để vừa uống cà phê,\nvừa nói chuyện giết thời gian.\nEm muốn thử làm chuyện\nngười bình thường hay làm.\nỒ, anh à! Đã lâu không gặp.\nEm chưa ăn trưa nhỉ… Thôi em đi nhé.\nMúp míp nhỉ?\nEm không vào lớp hả? Vâng. Em có chút chuyện… Ừ.\\n왜! 뭔데? 왜, 왜. 지금 몇 시야? (송지원) 윤선배 이상해...\n(윤진명) 그냥 별일 없이 만나서...\n커피 마시고...\n얘기하고 시간보내고. 그런 거 한번\n해보고 싶었어요, 남들처럼\n어머 오빠! 오랜만이네...\n점심 안 먹었으면... 그럼 볼 일 봐...\n엄청 통통한 거 있지...\n강의 안 들어? 네...일이 좀 있어서... 그래\\nWhat? What is it? What? What time is it? Yoon is acting strange.\nI always wanted to do things like dating, drinking coffee, talking, visiting restaurants, and so on.\nJust like everyone else.\nHey. Long time no see.\nYou didn't have lunch yet?\nSee ya. So chubby! You're not going to class?\nNo. Something came up. Okay.","koRange":{"start":3547.119339,"end":3576.438262},"viRange":{"start":3615.201658,"end":3644.264334},"start":3547.119339,"end":3644.264334,"koSentenceMarks":[3555.385,3557.514,3558.623,3563.41,3566.395,3567.89,3570.039,3576.438],"koShadowSegments":[{"index":0,"start":3547.119339,"end":3555.385,"text":"왜! 뭔데? 왜, 왜. 지금 몇 시야? (송지원) 윤선배 이상해...","speed":1,"cueUid":"merged-mtk7azu4-45"},{"index":1,"start":3555.385,"end":3557.514,"text":"(윤진명) 그냥 별일 없이 만나서...","speed":1,"cueUid":"merged-mtk7azu4-45"},{"index":2,"start":3557.514,"end":3558.623,"text":"커피 마시고...","speed":1,"cueUid":"merged-mtk7azu4-45"},{"index":3,"start":3558.623,"end":3563.41,"text":"얘기하고 시간보내고. 그런 거 한번 해보고 싶었어요, 남들처럼","speed":1,"cueUid":"merged-mtk7azu4-45"},{"index":4,"start":3563.41,"end":3566.395,"text":"어머 오빠! 오랜만이네...","speed":1,"cueUi  is.\nYou couldn't live or die for six whole years.\nIt must have been bad times. Right?","text":"Nhưng mẹ biết không?\nHy vọng vốn dĩ là tai ương đấy. Tiền bối Yoon!\nCậu biết chỗ đó ở đâu không?\nBệnh viện mà em trai tiền bối Yoon nằm.\nEm ấy trong sáu năm qua không sống cũng không chết.\nĐiều này hẳn là rất kinh khủng. Đúng không?\\n(윤진명) 근데 그거 알아요?\n(윤진명) 희망은 원래... (윤진명) 재앙이었다는 거...윤 선배!\n(송지원) 거기가 어딘지 알아요?\n윤진명 동생이 있다는 병원\n(윤진명) 6년 동안 죽지도 못하고...\n(윤진명) 살지도 못하고\n(윤진명) 그거 진짜 끔찍할 거야... (윤진명) 그치?\\nDid you know that hope brings calamity?\nYoon! Do you know where that is?\nThe hospital where\nJin-Myung's younger brother is.\nYou couldn't live or die for six whole years.\nIt must have been bad times. Right?","koRange":{"start":3576.438262,"end":3595.882},"viRange":{"start":3644.264334,"end":3663.452724},"start":3576.438262,"end":3663.452724,"koSentenceMarks":[3578.586,3583.144,3584.577,3586.507,3589.961,3591.239,3595.882],"koShadowSegments":[{"index":0,"start":3576.438262,"end":3578.586,"text":"(윤진명) 근데 그거 알아요?","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":1,"start":3578.586,"end":3583.144,"text":"(윤진명) 희망은 원래... (윤진명) 재앙이었다는 거...윤 선배!","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":2,"start":3583.144,"end":3584.577,"text":"(송지원) 거기가 어딘지 알아요?","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":3,"start":3584.577,"end":3586.507,"text":"윤진명 동생이 있다는 병원","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":4,"start":3586.507,"end":3589.961,"text":"(윤진명) 6년 동안 죽지도 못하고...","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":5,"start":3589.961,"end":3591.239,"text":"(윤진명) 살지도 못하고","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":6,"start":3591.239,"end":3595.882,"text":"(윤진명) 그거 진짜 끔찍할 거야... (윤진명) 그치?","speed":1,"cueUid":"merged-mtk7btoe-46"}],"hasShadow":true,"segments":[{"index":0,"start":3576.438262,"end":3578.586,"text":"(윤진명) 근데 그거 알아요?","speed":1,"cueUid":"merged-mtk7btoe-46"},{"index":1,"start":3578.586,"end":3583.144,"text":"(윤진명) 희망은 원래... (윤진명) 재앙이었다는 거...윤 선배! 문 보는 일밖에...\n할 수 있는 게 없었어요\n그때 사건현장 사진을 봤는데...\n강이나가 들고 있던 그 팔찌...\n제가 솔이한테 사준 겁니다","en":"All I could do in jail was... How did you know that\nYi-Na was related to Sol's death?\n...watch the news or read the newspaper.\nI saw the photo that was featured in the article.\nYi-Na was holding the bracelet\nthat I'd bought for Sol.","text":"Những điều tôi có thể làm trong tù…\nSAO ANH BIẾT YI NA LIÊN QUAN ĐẾN CÁI CHẾT CỦA SOL?\n…chỉ có xem thời sự và đọc báo.\nTôi thấy bức ảnh liên quan đến vụ tai nạn trên báo.\nKang Yi Na đang giữ vòng tay mà tôi mua cho Sol.\\n제가 감옥에서 할 수 있는 일은...\n뉴스하고 신문 보는 일밖에...\n할 수 있는 게 없었어요\n그때 사건현장 사진을 봤는데...\n강이나가 들고 있던 그 팔찌...\n제가 솔이한테 사준 겁니다\\nAll I could do in jail was... How did you know that\nYi-Na was related to Sol's death?\n...watch the news or read the newspaper.\nI saw the photo that was featured in the article.\nYi-Na was holding the bracelet\nthat I'd bought for Sol.","koRange":{"start":3615.19446,"end":3629.384755},"viRange":{"start":3683.042391,"end":3697.754363},"start":3615.19446,"end":3697.754363,"koSentenceMarks":[3618.532,3620.732,3622.393,3625.172,3627.684,3629.385],"koShadowSegments":[{"index":0,"start":3615.19446,"end":3618.532,"text":"제가 감옥에서 할 수 있는 일은...","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":1,"start":3618.532,"end":3620.732,"text":"뉴스하고 신문 보는 일밖에...","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":2,"start":3620.732,"end":3622.393,"text":"할 수 있는 게 없었어요","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":3,"start":3622.393,"end":3625.172,"text":"그때 사건현장 사진을 봤는데...","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":4,"start":3625.172,"end":3627.684,"text":"강이나가 들고 있던 그 팔찌...","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":5,"start":3627.684,"end":3629.384755,"text":"제가 솔이한테 사준 겁니다","speed":1,"cueUid":"merged-mtk7qruu-49"}],"hasShadow":true,"segments":[{"index":0,"start":3615.19446,"end":3618.532,"text":"제가 감옥에서 할 수 있는 일은...","speed":1,"cueUid":"merged-mtk7qruu-49"},{"index":1,"start":3618.532,"end":3620.7 thing that warrants such an action?\nWhy did you take Jin-Myung\nto your vacation home so late at night? I told you already. \nI brought her there to discuss something important.","text":"Ở trạm dừng đảo Haengdam. SOL LÀ ĐỨA CON GÁI THẾ NÀO?\nNghĩ lại thì… cô ấy cũng là nạn nhân. ANH BẢO YI NA SỐNG TIẾP. ĐIỀU ĐÓ CÓ Ý NGHĨA GÌ?\nGiá mà cô ấy không phải trải qua chuyện đó. Tôi chỉ muốn nói với cô ấy,\n\"Cô không có tội đâu. Đừng dằn vặt nữa.\" Việc còn sống không đáng xấu hổ chút nào.\nNếu Sol… Nếu Sol còn sống… Tôi cũng sẽ nói với con bé như vậy.\nANH CÓ MUỐN BIỆN MINH CHO HÀNH VI CỦA MÌNH?\nCái gì? Biện minh á? Tôi đã làm gì để phải giải trình à?\nLÝ DO ANH ĐƯA CÔ YOON JIN MYUNG ĐẾN BIỆT THỰ LÚC NỬA ĐÊM LÀ? \nTôi nói rồi mà. Tôi đưa cô ấy đến đó để bàn việc quan trọng.\\n행담도 휴게소에서. 생각해 보면...\n걔도 피해자고... 걔도 그런 일 안 겪었으면 좋았을 텐데...그 일을 겪은 게...\n니 잘못이 아니니까 그만 괴로워 하라고\n살아남은 건 부끄러운 게 아니라고...\n솔이가...솔이가 살아 있었어도...\n그런 얘기를 해주고 싶었을 것 같애요\n뭐... 변명이요? 제가 뭐...\n변명해야 할 일을 했습니까?\n아... 아, 그, 말했잖아요. 중요한 얘기를 하러 간 거라고\\nAt the rest stop at Haengdam-do. What kind of daughter was Sol?\nWhen I think about... She was a victim too. You told Yi-Na to live.\nWhat did you mean by that? It would've been nice if she hadn't\ngone through something like that.\nI just wanted to tell her, \"It's not your fault. So stop being miserable.\"\nAnd that having survived is nothing to be ashamed about.\nIf Sol... Had Sol been alive... I would've wanted to tell her\nthe same thing. Do you have any excuses for how you've acted?\nWhat? Excuse? Did I do something that warrants such an action?\nWhy did you take Jin-Myung\nto your vacation home so late at night? I told you already. \nI brought her there to discuss something important.","koRange":{"start":3629.384755,"end":3684.46},"viRange":{"start":3697.754363,"end":3753.543207},"start":3629.384755,"end":3753.543207,"koSentenceMarks":[3645.142,3652.079,3655.518,3659.199,3666.162,3669.389,3676.658,3678.959,3684.46],"koShadowSegments":[{"index":0,"start":3629.385 e back here.","text":"RÕ LÀ ANH SAI TRONG VỤ MẤT RƯỢU MÀ?\nTôi là quản lý và có trách nhiệm.\nNếu phát sinh tình huống đáng ngờ thì tôi phải điều tra.\nCảnh sát thẩm vấn nghi phạm để tìm hung thủ. \nNếu họ không phải hung thủ cảnh sát có xin lỗi không?\nANH SẼ XIN LỖI CHỨ? Thật hả? Thì xin lỗi, được chưa?\nThằng chó điên khùng. Đám người này… \nTên đeo kính vừa chửi phải không? Cậu lại đây.\\n난 레스토랑 매니저로서...\n책임져야 할 위치에 있습니다\n의심스런 상황이 있으면 조사를 해야 되는 거죠\n경찰이 범인 잡으려고 심문했는데...\n범인이 아니다, 그럼 뭐...\n사과해야 됩니까? 그래요? 사과하지, 뭐\n미안해. 사람들이... 니가 욕했지, 너 안경 쓴 놈, 일로 와봐! 자식이!\\nYou were totally wrong for that wine incident?\nAs a manager, I have responsibilities.\nIf there's something that sparks doubt, I have to investigate it.\nIf the cops accuse someone by mistake and once his innocence has proven do they apologize for that?\nWill you apologize? Really? I'll apologize then. Sorry. Crazy bastard.\nThese people...\nYou with the glasses, the one who swore. Come back here.","koRange":{"start":3629.384755,"end":3732.501112},"viRange":{"start":3776.467107,"end":3798.008185},"start":3629.384755,"end":3798.008185,"koSentenceMarks":[3711.488,3713.129,3715.488,3717.678,3719.211,3722.592,3732.501],"koShadowSegments":[{"index":0,"start":3629.385,"end":3711.488,"text":"난 레스토랑 매니저로서...","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":1,"start":3711.488,"end":3713.129,"text":"책임져야 할 위치에 있습니다","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":2,"start":3713.129,"end":3715.488,"text":"의심스런 상황이 있으면 조사를 해야 되는 거죠","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":3,"start":3715.488,"end":3717.678,"text":"경찰이 범인 잡으려고 심문했는데...","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":4,"start":3717.678,"end":3719.211,"text":"범인이 아니다, 그럼 뭐...","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":5,"start":3719.211,"end":3722.592,"text":"사과해야 됩니까? 그래요? 사과하지, 뭐","speed":1,"cueUid":"merged-mtk853kd-53"},{"index":6,"start":3722.592,"end":3732.501,"text":"미안해. 사람들이... 니가 욕했지, 너 안경 쓴 놈, 일로 와봐! 자식이!","speed":1,"cueUid" function escHtml(s){return String(s||'').replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function fmt(t){t=Math.max(0,Number(t)||0);let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000);if(ms>=1000){s++;ms-=1000}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+String(ms).padStart(3,'0')}
function shortTime(t){return fmt(t).replace(/^00:/,'').replace(',', '.')}
function rangeOk(r){return r&&isFinite(Number(r.start))&&isFinite(Number(r.end))&&Number(r.end)>Number(r.start)}
function clampSpeed(v){v=Number(v);if(!isFinite(v)||v<=0)v=1;return Math.max(.45,Math.min(1.5,Math.round(v*100)/100))}
function segSpeed(s){return clampSpeed(s&&(s.speed??s.rate??s.playbackRate??1))}
function speedOptions(rate){const opts=[0.5,0.6,0.7,0.75,0.8,0.85,0.9,1,1.1,1.2,1.3,1.5],r=clampSpeed(rate);return opts.map(function(v){return '<option value="'+v+'" '+(Math.abs(v-r)<.001?'selected':'')+'>'+String(v.toFixed(v===1?0:2)).replace(/0$/,'').replace(/.0$/,'')+'x</option>'}).join('')}
function setSegSpeed(i,v){const it=items[cur]||{}, seg=(it.segments||[])[i];if(!seg)return;seg.speed=clampSpeed(v);render()}
function nudgeSegSpeed(i,d){const it=items[cur]||{}, seg=(it.segments||[])[i];if(!seg)return;setSegSpeed(i,segSpeed(seg)+Number(d||0))}
function rangeFor(it,kind){return kind==='vi'?it.viRange:it.koRange}
function itemText(it){return [it.ko,it.vi,it.en].join(' ').toLowerCase()}
function setStatus(s){$('status').textContent=s||''}
function setVol(kind){const v=Number($(kind+'Vol').value||100);audios[kind].volume=Math.min(1,v/100);$(kind+'VolLabel').textContent=Math.round(v)+'%'}
function audioCandidates(kind){const file=String(kind==='vi'?project.viAudioFile:project.koAudioFile||'').trim();const folder=String(project.audioFolder||'audio').replace(/^\.\//,'').replace(/^\/+|\/+$/g,'')||'audio';const slug=String(project.githubSlug||project.title||'shadow').replace(/[^A-Za-z0-9._-]+/g,'_');const fallback=kind==='vi'?[slug+'_VI_Dub.mp3',slug+'_vi_dub.mp3','VI_Dub.mp3','vi_dub.mp3']:[slug+'_KO_Live.mp3',slug+'_ko_live.mp3','KO_Live.mp3','ko_live.mp3'];const names=[file].concat(fallback).filter(Boolean);const out=[];names.forEach(function(n){out.push('../'+folder+'/'+n);out.push('./'+folder+'/'+n);out.push('../../'+folder+'/'+n);out.push(n)});return Array.from(new Set(out))}
function tryAutoAudio(kind){const a=audios[kind];const c=audioCandidates(kind);let i=0;function next(){if(i>=c.length){$(kind+'AudioStatus').textContent='Chưa tự nạp được audio. Hãy chọn file thủ công.';return}const src=c[i++];$(kind+'AudioStatus').textContent='Thử nạp: '+src;a.src=src;try{a.load()}catch(e){next()}}a.onerror=next;a.oncanplay=function(){$(kind+'AudioStatus').textContent='Đã nạp: '+(a.currentSrc||a.src)};if(c.length)next()}
function segmentCardHtml(s,i,mini){const active=i===activeSeg?' active':'';const hasText=String(s.text||'').trim().length>0;const text=hasText?escHtml(s.text):'<span class="small">[Khoảng âm thanh không lời]</span>';const label=hasText?'Câu ':'Đoạn ';if(mini){return '<div class="miniSeg'+active+'"><div class="miniHead"><span>'+label+(i+1)+'</span><span>'+shortTime(s.start)+' → '+shortTime(s.end)+' · '+(Number(s.end)-Number(s.start)).toFixed(2)+'s · '+segSpeed(s)+'x</span></div><div class="miniText">'+text+'</div><div class="miniSpeed"><span class="small">Tốc</span><select onchange="setSegSpeed('+i+',this.value)">'+speedOptions(s.speed)+'</select><button onclick="nudgeSegSpeed('+i+',-.1)">-</button><button onclick="nudgeSegSpeed('+i+',.1)">+</button></div><div class="miniBtns"><button class="violet" onclick="playSegment('+i+',\'once\')">Nghe</button><button class="warn" onclick="playSegment('+i+',\'repeat\')">Repeat</button><button class="good" onclick="playSegment('+i+',\'shadow\')">Shadow</button></div></div>'}return '<div class="seg'+active+'"><div class="segHead"><span>'+label+(i+1)+'</span><span>'+fmt(s.start)+' → '+fmt(s.end)+' · '+(Number(s.end)-Number(s.start)).toFixed(2)+'s · '+segSpeed(s)+'x</span></div><div class="segText">'+text+'</div><div class="segSpeed"><span class="small">Tốc độ</span><select onchange="setSegSpeed('+i+',this.value)">'+speedOptions(s.speed)+'</select><button onclick="nudgeSegSpeed('+i+',-.1)">-</button><button onclick="nudgeSegSpeed('+i+',.1)">+</button></div><div class="segBtns"><button class="violet" onclick="playSegment('+i+',\'once\')">Nghe</button><button class="warn" onclick="playSegment('+i+',\'repeat\')">Repeat</button><button class="good" onclick="playSegment('+i+',\'shadow\')">Shadow</button></div></div>'}
function inlineDetailHtml(it,i){if(i!==cur)return '';const segs=it.segments||[];const hasShadow=segs.length>0;let html='<div class="inlineDetail" onclick="event.stopPropagation()"><div class="inlineMain">';if(it.vi)html+='<div class="inlineBlock vi"><b>VI</b>\n'+escHtml(it.vi)+'</div>';if(it.ko)html+='<div class="inlineBlock ko"><b>KO</b>\n'+escHtml(it.ko)+'</div>';if(it.en)html+='<div class="inlineBlock en"><b>EN</b>\n'+escHtml(it.en)+'</div>';html+='</div>';if(hasShadow){html+='<div class="inlineSegs">'+segs.map(function(s,j){return segmentCardHtml(s,j,true)}).join('')+'</div>'}else{html+='<div class="empty">Cue này chưa có Shadow. Có thể nghe cả cue bằng VI Dub / KO Live.</div>'}return html+'</div>'}
function renderList(){const q=String($('q').value||'').toLowerCase();let shown=0;const html=items.map(function(it,i){if(q&&!itemText(it).includes(q))return '';shown++;const hasShadow=!!it.hasShadow;const vr=rangeOk(it.viRange), kr=rangeOk(it.koRange);const koPreview=escHtml(String(it.ko||'').split('\n').slice(0,3).join('\n'));const viPreview=escHtml(String(it.vi||'').split('\n').slice(0,2).join('\n'));return '<div id="cue-'+i+'" class="cue '+(i===cur?'active':'')+'" onclick="cur='+i+';activeSeg=0;hideHeaderNow();render();"><div class="cueTop"><span class="cueNo">'+String(i+1).padStart(2,'0')+'.</span>'+(hasShadow?'<span class="badge shadow">SHADOW</span>':'')+(vr?'<span class="badge vi">VI</span>':'')+(kr?'<span class="badge ko">KO</span>':'')+'<span class="badge">'+(it.segments?it.segments.length:0)+' câu</span></div><div class="cueText ko">'+koPreview+'</div><div class="cuePreview">'+viPreview+'</div>'+inlineDetailHtml(it,i)+'</div>'}).join('');$('list').innerHTML=html||'<div class="empty">Không có cue phù hợp.</div>';$('count').textContent=shown+' / '+items.length+' cue · có shadow: '+(project.shadowCount||items.filter(function(x){return x.hasShadow}).length)}
function render(){const it=items[cur]||{};renderList();$('meta').textContent=[project.movieTitle,project.episodeTitle].filter(Boolean).join(' ')+' · Cue '+(cur+1)+'/'+items.length+' · Shadow '+(project.shadowCount||0);$('viText').textContent=it.vi||'';$('koText').textContent=it.ko||'';$('enText').textContent=it.en||'';const segs=it.segments||[];if(!segs.length){$('segs').innerHTML='<div class="empty">Cue này chưa có ngắt câu Shadow. Vẫn có thể nghe VI Dub / KO Live cả cue nếu có audio range.</div>';return}$('segs').innerHTML=segs.map(function(s,i){return segmentCardHtml(s,i,false)}).join('')}
function scrollToActive(){const el=$('cue-'+cur);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
function pauseAll(){token++;clearTimeout(timer);timer=null;stopAt.vi=null;stopAt.ko=null;try{audios.vi.pause()}catch(e){}try{audios.ko.pause()}catch(e){}setStatus('Pause.')}
function playRange(kind,start,end,label,done,rate){const a=audios[kind];if(!a.src)return alert('Chưa có '+kind.toUpperCase()+' audio. Hãy chọn file hoặc kiểm tra folder audio.');try{a.playbackRate=rate||1}catch(e){}token++;const tk=token;clearTimeout(timer);stopAt[kind]=Number(end);try{audios[kind==='vi'?'ko':'vi'].pause()}catch(e){}a.currentTime=Number(start);setStatus(label+' · '+fmt(start)+' → '+fmt(end));a.play().catch(function(e){alert('Không phát được audio: '+(e&&e.message?e.message:e))});const check=function(){if(tk!==token)return;if(a.currentTime>=Number(end)-.025){a.pause();stopAt[kind]=null;if(done)done();return}timer=setTimeout(check,45)};check()}
function playCue(kind){const it=items[cur];if(!it)return;const rg=rangeFor(it,kind);if(!rangeOk(rg))return alert('Cue này chưa có '+kind.toUpperCase()+' range.');playRange(kind,Number(rg.start),Number(rg.end),(kind==='vi'?'VI Dub':'KO Live')+' cue #'+(cur+1))}
function playSegment(i,mode){const it=items[cur]||{}, seg=(it.segments||[])[i];if(!seg)return alert('Cue này chưa có câu shadow.');activeSeg=i;render();const total=mode==='once'?1:Math.max(1,Number($('repeat').value)||3);let n=0;const rate=segSpeed(seg), dur=Math.max(.05,Number(seg.end)-Number(seg.start)), gap=mode==='shadow'?Math.max(1,Math.min(5,dur/rate+.5)):.35;const run=function(){if(n>=total){setStatus('Xong câu '+(i+1));return}n++;playRange('ko',seg.start,seg.end,(mode==='shadow'?'Shadow':'Repeat')+' câu '+(i+1)+' · '+rate+'x · lượt '+n+'/'+total,function(){timer=setTimeout(run,gap*1000)},rate)};run()}
function playActiveSeg(mode){playSegment(activeSeg,mode||'repeat')}
function prevCue(){cur=Math.max(0,cur-1);activeSeg=0;render();scrollToActive()}function nextCue(){cur=Math.min(items.length-1,cur+1);activeSeg=0;render();scrollToActive()}
function hideHeaderNow(){const t=document.querySelector('.top');if(t)t.classList.add('hide')}
function showHeaderNow(){const t=document.querySelector('.top');if(t)t.classList.remove('hide')}
function initAutoHeader(){
  const t=document.querySelector('.top');if(!t)return;
  let last=window.scrollY||0,lock=0;
  window.addEventListener('scroll',function(){
    const y=window.scrollY||0,now=Date.now();
    if(y<24){t.classList.remove('hide');last=y;return}
    if(now-lock<180){last=y;return}
    if(y>last+10)t.classList.add('hide');
    else if(y<last-18)t.classList.remove('hide');
    last=y;
  },{passive:true});
  document.addEventListener('focusin',function(e){if(e.target&&/input|textarea|select/i.test(e.target.tagName)){t.classList.add('hide');lock=Date.now();}});
}
function toggleFloatPanel(e){if(e)e.stopPropagation();const el=$('floatCtl');if(!el)return;if(el.dataset.moved==='1'){el.dataset.moved='0';return}el.classList.toggle('open')}
function initFloatDrag(){const el=$('floatCtl'),h=$('floatMain');if(!el||!h)return;let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;h.addEventListener('pointerdown',function(e){if(window.innerWidth>760)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{h.setPointerCapture(e.pointerId)}catch(_){}});h.addEventListener('pointermove',function(e){if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const maxX=window.innerWidth-el.offsetWidth-8,maxY=window.innerHeight-el.offsetHeight-8;el.style.left=Math.max(8,Math.min(maxX,ox+dx))+'px';el.style.top=Math.max(8,Math.min(maxY,oy+dy))+'px';el.style.right='auto';el.style.bottom='auto'});function end(){if(!drag)return;drag=false;if(moved){el.dataset.moved='1';try{localStorage.setItem('shadowFloatPos',JSON.stringify({left:el.style.left,top:el.style.top}))}catch(_){}}}h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);try{const p=JSON.parse(localStorage.getItem('shadowFloatPos')||'null');if(p&&p.left&&p.top&&window.innerWidth<=760){el.style.left=p.left;el.style.top=p.top;el.style.right='auto';el.style.bottom='auto'}}catch(_){}}
function toggleSettings(){const s=$('settings');s.classList.toggle('hidden')}
audios.vi.ontimeupdate=function(){if(stopAt.vi!=null&&audios.vi.currentTime>=stopAt.vi){audios.vi.pause();stopAt.vi=null}}
audios.ko.ontimeupdate=function(){if(stopAt.ko!=null&&audios.ko.currentTime>=stopAt.ko){audios.ko.pause();stopAt.ko=null}}
$('q').oninput=renderList;$('viVol').oninput=function(){setVol('vi')};$('koVol').oninput=function(){setVol('ko')};$('viFile').onchange=function(e){const f=e.target.files[0];if(f){audios.vi.src=URL.createObjectURL(f);$('viAudioStatus').textContent='Đã nạp VI từ máy: '+f.name}};$('koFile').onchange=function(e){const f=e.target.files[0];if(f){audios.ko.src=URL.createObjectURL(f);$('koAudioStatus').textContent='Đã nạp KO từ máy: '+f.name}};
document.addEventListener('keydown',function(e){if(/input|textarea|select/i.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(audios.ko.paused)playCue('ko');else pauseAll()}if(e.key==='ArrowRight')nextCue();if(e.key==='ArrowLeft')prevCue();if(e.key==='v'||e.key==='V')playCue('vi');if(e.key==='k'||e.key==='K')playCue('ko')});
initFloatDrag();initAutoHeader();setVol('vi');setVol('ko');tryAutoAudio('vi');tryAutoAudio('ko');render();
</script>
</body>
</html>
